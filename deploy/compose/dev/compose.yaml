# Development and evaluation services. Start them with `task dev`.
# Every credential in this directory is for local development only.
#
#   task dev                                     PostgreSQL and Keycloak
#   docker compose --profile core up -d --build  also the core, built from source
#   docker compose --profile otel up -d          also an OpenTelemetry collector
#
# Host ports can be changed in a local, uncommitted .env file next to this one
# (WT_POSTGRES_PORT, WT_KEYCLOAK_PORT, WT_CONSOLE_PORT, WT_MACHINE_PORT,
# WT_OPERATIONS_PORT, WT_OTLP_GRPC_PORT, WT_OTLP_HTTP_PORT), and so can
# WT_TRACING_OTLP_ENDPOINT, which sends the core's traces to a collector.
name: whitetower-dev

services:
  postgres:
    image: postgres:${WT_POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_DB: whitetower
      POSTGRES_USER: whitetower
      POSTGRES_PASSWORD: whitetower-dev-only
    ports:
      - "127.0.0.1:${WT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the migration and runtime roles on the first start.
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whitetower -d whitetower"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    # Development IdP: realm "whitetower" with one test user per role (see keycloak/).
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${WT_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl: ask the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Applies the migrations as the migration role, then exits; the core waits
  # for it. Only this service gets the migration role's password (DC-3).
  migrate:
    profiles: [core]
    image: whitetower-dev-core
    build: &core-build
      context: ../../..
      dockerfile: deploy/docker/Dockerfile
    command: ["migrate"]
    environment:
      WT_DATABASE_MIGRATION_URL: postgres://whitetower_migrator@postgres:5432/whitetower?sslmode=disable
      WT_DATABASE_MIGRATION_PASSWORD_FILE: /run/secrets/db-migrator-password
    secrets: [db-migrator-password]
    depends_on:
      postgres:
        condition: service_healthy

  whitetower:
    profiles: [core]
    image: whitetower-dev-core
    build: *core-build
    environment:
      # A self-signed certificate made at startup: for development only.
      WT_DEV_SELF_SIGNED_TLS: "true"
      WT_DATABASE_URL: postgres://whitetower_app@postgres:5432/whitetower?sslmode=disable
      WT_DATABASE_PASSWORD_FILE: /run/secrets/db-app-password
      # The audit log, with a checkpoint key for development only.
      WT_AUDIT_ORIGIN: whitetower.localhost/audit
      WT_AUDIT_CHECKPOINT_KEY_FILE: /run/secrets/audit-checkpoint-key
      # Empty: no trace leaves the core. http://otel-collector:4318 sends them
      # to the collector of the otel profile.
      WT_TRACING_OTLP_ENDPOINT: ${WT_TRACING_OTLP_ENDPOINT:-}
    secrets: [db-app-password, audit-checkpoint-key]
    ports:
      - "127.0.0.1:${WT_CONSOLE_PORT:-8443}:8443"
      - "127.0.0.1:${WT_MACHINE_PORT:-9443}:9443"
      - "127.0.0.1:${WT_OPERATIONS_PORT:-9090}:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Distroless images have no shell: the binary checks itself.
      test: ["CMD", "/usr/local/bin/whitetower", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    profiles: [otel]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${WT_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${WT_OTLP_HTTP_PORT:-4318}:4318"

volumes:
  postgres-data:

# Password files, mounted under /run/secrets as a Kubernetes Secret would be.
secrets:
  db-app-password:
    file: ./secrets/db-app-password
  db-migrator-password:
    file: ./secrets/db-migrator-password
  audit-checkpoint-key:
    file: ./secrets/audit-checkpoint-key
