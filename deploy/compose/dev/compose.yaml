# Development and evaluation services. Start them with `task dev`.
# Every credential in this directory is for local development only.
#
#   task dev                                     PostgreSQL and Keycloak
#   docker compose --profile core up -d --build  also the core, built from source
#   docker compose --profile otel up -d          also an OpenTelemetry collector
#
# Host ports can be changed in a local, uncommitted .env file next to this one
# (WT_POSTGRES_PORT, WT_KEYCLOAK_PORT, WT_CONSOLE_PORT, WT_MACHINE_PORT,
# WT_OPERATIONS_PORT, WT_OTLP_GRPC_PORT, WT_OTLP_HTTP_PORT).
name: whitetower-dev

services:
  postgres:
    image: postgres:${WT_POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_DB: whitetower
      POSTGRES_USER: whitetower
      POSTGRES_PASSWORD: whitetower-dev-only
    ports:
      - "127.0.0.1:${WT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whitetower -d whitetower"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    # Development IdP: realm "whitetower" with one test user per role (see keycloak/).
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev-only
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${WT_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl: ask the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  whitetower:
    profiles: [core]
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      # A self-signed certificate made at startup: for development only.
      WT_DEV_SELF_SIGNED_TLS: "true"
    ports:
      - "127.0.0.1:${WT_CONSOLE_PORT:-8443}:8443"
      - "127.0.0.1:${WT_MACHINE_PORT:-9443}:9443"
      - "127.0.0.1:${WT_OPERATIONS_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Distroless images have no shell: the binary checks itself.
      test: ["CMD", "/usr/local/bin/whitetower", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    profiles: [otel]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${WT_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${WT_OTLP_HTTP_PORT:-4318}:4318"

volumes:
  postgres-data:
