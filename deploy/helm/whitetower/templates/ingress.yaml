{{- if .Values.ingress.console.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "whitetower.fullname" . }}-console
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
    whitetower.io/listener: console
  {{- with .Values.ingress.console.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.console.className }}
  ingressClassName: {{ .Values.ingress.console.className }}
  {{- end }}
  {{- if .Values.ingress.console.tls }}
  tls:
    {{- toYaml .Values.ingress.console.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.console.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "whitetower.fullname" $ }}-console
                port:
                  number: {{ $.Values.service.console.port }}
          {{- end }}
    {{- end }}
{{- end }}
