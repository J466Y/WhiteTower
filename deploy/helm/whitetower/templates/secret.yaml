{{- if not .Values.secrets.databaseApp.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whitetower.fullname" . }}-db-app
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.secrets.databaseApp.password | quote }}
---
{{- end }}
{{- if not .Values.secrets.databaseMigrator.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whitetower.fullname" . }}-db-migrator
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.secrets.databaseMigrator.password | quote }}
---
{{- end }}
{{- if not .Values.secrets.auditCheckpointKey.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whitetower.fullname" . }}-audit-checkpoint
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  key.pem: {{ .Values.secrets.auditCheckpointKey.key | quote }}
---
{{- end }}
{{- if and .Values.secrets.tokenSigningKey.key (not .Values.secrets.tokenSigningKey.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whitetower.fullname" . }}-token-signing
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  key.pem: {{ .Values.secrets.tokenSigningKey.key | quote }}
---
{{- end }}
{{- if and .Values.secrets.bundleSigningKey.key (not .Values.secrets.bundleSigningKey.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whitetower.fullname" . }}-bundle-signing
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  key.pem: {{ .Values.secrets.bundleSigningKey.key | quote }}
---
{{- end }}
{{- if and .Values.secrets.oidcClientSecret.secret (not .Values.secrets.oidcClientSecret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whitetower.fullname" . }}-oidc-client-secret
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ .Values.secrets.oidcClientSecret.secret | quote }}
---
{{- end }}
{{- if and .Values.tls.console.cert .Values.tls.console.key (not .Values.tls.console.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whitetower.fullname" . }}-tls-console
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.tls.console.cert | quote }}
  tls.key: {{ .Values.tls.console.key | quote }}
---
{{- end }}
{{- if and .Values.tls.machine.cert .Values.tls.machine.key (not .Values.tls.machine.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whitetower.fullname" . }}-tls-machine
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ .Values.tls.machine.cert | quote }}
  tls.key: {{ .Values.tls.machine.key | quote }}
{{- end }}
