apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "whitetower.fullname" . }}-test-connection"
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: test-connection
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - whitetower
        - healthcheck
      env:
        - name: WT_LISTENERS_OPERATIONS_ADDRESS
          value: "{{ include "whitetower.fullname" . }}-operations:{{ .Values.service.operations.port }}"
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
  restartPolicy: Never
