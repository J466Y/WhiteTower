{{- if .Values.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "whitetower.fullname" . }}
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "whitetower.selectorLabels" . | nindent 6 }}
{{- end }}
