{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "whitetower.fullname" . }}
  labels:
    {{- include "whitetower.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "whitetower.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Port 8443 (console): Web console and public REST API.
    # Reachable only from ingress controllers or authorized client networks (ST-63).
    - ports:
        - protocol: TCP
          port: {{ .Values.service.console.port }}
      {{- if .Values.networkPolicy.ingress.console.from }}
      from:
        {{- toYaml .Values.networkPolicy.ingress.console.from | nindent 8 }}
      {{- end }}
    # Port 9443 (machine): Token endpoint and module API (HTTP/2).
    # Reachable only from modules and enforcement points (ST-63).
    - ports:
        - protocol: TCP
          port: {{ .Values.service.machine.port }}
      {{- if .Values.networkPolicy.ingress.machine.from }}
      from:
        {{- toYaml .Values.networkPolicy.ingress.machine.from | nindent 8 }}
      {{- end }}
    # Port 9090 (operations): Prometheus metrics and health checks.
    # Reachable only from monitoring systems and Prometheus (ST-63).
    - ports:
        - protocol: TCP
          port: {{ .Values.service.operations.port }}
      {{- if .Values.networkPolicy.ingress.operations.from }}
      from:
        {{- toYaml .Values.networkPolicy.ingress.operations.from | nindent 8 }}
      {{- end }}
  egress:
    # Cluster DNS resolution
    {{- if .Values.networkPolicy.egress.dns.enabled }}
    - ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.egress.dns.port }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.dns.port }}
    {{- end }}
    # PostgreSQL database connectivity
    {{- if .Values.networkPolicy.egress.database.enabled }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.database.port }}
    {{- end }}
    # Custom egress rules (e.g. IdP OIDC, OTLP collector, SIEM)
    {{- if .Values.networkPolicy.egress.custom }}
    {{- toYaml .Values.networkPolicy.egress.custom | nindent 4 }}
    {{- end }}
{{- end }}
