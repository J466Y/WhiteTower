name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here.** See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps, commands or configuration that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `whitetower -version` or `wtctl version`, or the commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, deployment (Compose, Helm, binary), IdP, and anything else relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove secrets and personal data first.
      render: text
