# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release pipeline (plan P0-01, step 9): signed binaries and images, SBOMs
# (SPDX and CycloneDX) and checksums. Build provenance is attested by the
# release workflow. Run locally with `task release:snapshot`.
version: 2

project_name: whitetower

before:
  hooks:
    - go mod download
    # Builds the console into internal/webui/dist, which the embedui tag embeds.
    - go tool -modfile=hack/tools/go.mod task build:web

builds:
  - id: whitetower
    main: ./cmd/whitetower
    binary: whitetower
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    tags: [embedui]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/J466Y/WhiteTower/internal/version.version={{ .Version }}
      - -X github.com/J466Y/WhiteTower/internal/version.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: wtctl
    main: ./cmd/wtctl
    binary: wtctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/J466Y/WhiteTower/internal/version.version={{ .Version }}
      - -X github.com/J466Y/WhiteTower/internal/version.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: whitetower
    ids: [whitetower]
    name_template: "whitetower_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, NOTICE, README.md]

  - id: wtctl
    ids: [wtctl]
    name_template: "wtctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  # One SBOM per archive in each format (requirement NFR-13).
  - id: spdx
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]
  - id: cyclonedx
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.cdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  # Keyless signature of the checksum file, which covers every archive and SBOM.
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

dockers_v2:
  - id: whitetower
    ids: [whitetower]
    dockerfile: deploy/docker/goreleaser.Dockerfile
    images:
      - ghcr.io/j466y/whitetower
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: White Tower
      org.opencontainers.image.description: Open source control plane for AI agent governance
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    sbom: true

docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"

release:
  prerelease: auto
  draft: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
