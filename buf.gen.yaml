# Code generation for the module API. Plugins run as pinned Go tools, so no
# network access to a plugin registry is needed (air-gap friendly).
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/J466Y/WhiteTower/pkg/moduleapi
plugins:
  - local: [go, tool, -modfile=hack/tools/go.mod, protoc-gen-go]
    out: pkg/moduleapi
    opt: paths=source_relative
  - local: [go, tool, -modfile=hack/tools/go.mod, protoc-gen-connect-go]
    out: pkg/moduleapi
    opt: paths=source_relative
