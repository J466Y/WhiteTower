# Read by OSV-Scanner, and by the OpenSSF Scorecard check built on it, for the
# pinned tools in go.mod. CI checks the tool binaries by reachability instead
# (govulncheck -mode=binary, job "Supply chain"), so a tool that starts calling
# vulnerable code still fails it.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is deprecated and will not be fixed, so every x/crypto version matches. No tool imports it (go list -deps tool)."
