openapi: 3.1.0
info:
  title: White Tower public API
  version: 0.0.0
  summary: Public REST API of the White Tower governance core.
  description: |
    This document is the source of truth of the public API: the Go server
    interfaces, the Go client and the console's TypeScript types are generated
    from it with `task gen`. The server serves it at `/api/v1/openapi.json`.

    Every operation needs a session or an API token, unless it says
    otherwise. Errors are RFC 9457 problem details, whose `code` member is a
    stable error code (docs/reference/api-errors.md); messages are in
    English. Clients are rate-limited, per principal or, before login, per
    client address.

    Pre-alpha: a plan agrees on its operations before it builds them, and an
    operation whose server side is not built yet answers `not_implemented`.
  contact:
    name: White Tower maintainers
    url: https://github.com/J466Y/WhiteTower
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - session: []
  - apiToken: []
tags:
  - name: meta
    description: Information about the server itself.
  - name: identity
    description: Who is calling.
  - name: tokens
    description: API tokens for personal access and automation.
  - name: audit
    description: Tamper-evident audit log events, proofs, checkpoints and verification keys.
  - name: inventory
    description: Agents, their owners and use cases, their lifecycle and their periodic reviews.
  - name: inbox
    description: The work that waits for the caller.
  - name: catalog
    description: |
      MCP servers, tools and models, their review and blocks, and each
      agent's tooling and usage rules (RFC-0002). Their answers carry
      references and reported text, so the authorizer refuses every
      operation of this tag to a caller without `catalog.view`, besides its
      own permission: an API token needs that scope too.
paths:
  /version:
    get:
      operationId: getVersion
      summary: Get the version of the running server
      description: |
        Returns the release version and Git commit of the running server, and
        the version of this API. It needs no authentication, so clients can
        check compatibility before logging in.
      tags: [meta]
      security: []
      responses:
        "200":
          description: Version of the running server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Get the calling principal
      description: |
        Returns the calling principal, their roles, their permissions derived
        from the governance matrix, and the CSRF token of the active session.
      tags: [identity]
      responses:
        "200":
          description: The calling principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        default:
          $ref: "#/components/responses/Problem"
  /tokens:
    get:
      operationId: listTokens
      summary: List API tokens
      description: |
        Lists active and historical API tokens for the calling principal or
        another one. A caller lists their own tokens, those of the service
        accounts they are responsible for, and, with the permission
        `identity.tokens.manage`, those of any principal: an API token needs
        that permission in its scopes too. Another principal's tokens are
        otherwise `forbidden`.
      tags: [tokens]
      parameters:
        - name: principalId
          in: query
          required: false
          description: Optional principal ID whose tokens to list (the person responsible for a service account, or a holder of `identity.tokens.manage`).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The list of API tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiTokenMetadata"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      summary: Create an API token
      description: |
        Generates a new API token. The raw token secret is returned in the response
        and is never retrievable again. A caller creates tokens for
        themselves, for the service accounts they are responsible for, and,
        with the permission `identity.tokens.manage`, for any principal: an
        API token needs that permission in its scopes too. Another principal
        is otherwise `forbidden`. A token never does more than whoever
        creates it: each scope must be a permission of the token's principal
        and of the caller, and one of the scopes of the caller's own token when
        the caller uses one; otherwise the request is refused (`forbidden`).
        No token holds `identity.emergency.revoke`, which no token can use:
        that scope is `bad_request`, as an unknown one is.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The created API token including its plaintext secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Problem"
  /tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke an API token
      description: |
        Revokes an active API token by its ID. A caller revokes their own
        tokens, those of the service accounts they are responsible for, and,
        with the permission `identity.tokens.manage`, any token: the tokens
        they may list. An API token needs that permission in its scopes too.
        Any other token is `not_found`, as a token that does not exist is, so
        that a token's ID never shows whether the token exists.
      tags: [tokens]
      parameters:
        - name: id
          in: path
          required: true
          description: The token identifier.
          schema:
            type: string
            format: uuid
        - name: reason
          in: query
          required: false
          description: Reason for revocation.
          schema:
            type: string
      responses:
        "204":
          description: Token successfully revoked.
        default:
          $ref: "#/components/responses/Problem"
  /tokens/exchange:
    post:
      operationId: exchangeToken
      summary: Exchange CLI ID token for an API token
      description: |
        Exchanges an OpenID Connect ID token from the CLI's public client login for a short-lived
        API token (12 hours) bound to the same human principal. A server without OIDC sign-in
        has no token exchange: the operation is then `not_found`, with the detail that token
        exchange is not configured. A server that has not reached its identity provider yet,
        which it keeps trying to do after it starts, cannot verify ID tokens: the operation is
        then `unavailable`, with `Retry-After`.
      tags: [tokens]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeTokenRequest"
      responses:
        "200":
          description: The created API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Problem"
  /service-accounts:
    get:
      operationId: listServiceAccounts
      summary: List service accounts
      description: |
        Lists the service accounts that the caller is responsible for and,
        with the permission `identity.tokens.manage`, every service account:
        an API token needs that permission in its scopes too. An
        administrator lists the service accounts to manage their tokens.
      tags: [identity]
      responses:
        "200":
          description: The list of service accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceAccount"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createServiceAccount
      summary: Create a service account
      description: |
        Creates a non-human service account principal with the caller as
        responsible principal. Only a person is responsible for one, and gives
        it only roles they hold (`forbidden` otherwise). The service account
        acts with the roles that its responsible principal still holds, and
        with none while that principal is inactive.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountRequest"
      responses:
        "201":
          description: The created service account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
        default:
          $ref: "#/components/responses/Problem"
  /emergency-revocation:
    post:
      operationId: revokeAllSessionsAndTokens
      summary: End every session and API token at once
      description: |
        Ends, at once and for a reason, every session and every API token,
        of people and of service accounts, the CLI's tokens included, so that
        nothing that a compromised identity provider let someone obtain
        outlives it (HUM-10). It revokes every one that is not revoked yet,
        expired ones included, since the clock of another replica may not
        have reached their expiry. Principals and their roles stay: everyone
        signs in again, and the integrations' tokens are created again. The
        caller's own session ends too, unless it is a break-glass session:
        the answer then clears the session cookie, as a sign-out does. Every
        other break-glass session ends.

        The platform administrator runs it, from a session
        (`identity.emergency.revoke`), and so does the break-glass custodian.
        An API token never does, whatever its scopes: it is `forbidden`. A
        missing, blank or longer reason is `bad_request`. The audit log
        records it, with how many sessions and tokens it ended, and the
        server logs a security alert. A second run ends nothing new, and is
        recorded too.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyRevocationRequest"
      responses:
        "200":
          description: What the revocation ended.
          headers:
            Set-Cookie:
              description: Clears the session cookie when the caller's own session ended.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyRevocation"
        default:
          $ref: "#/components/responses/Problem"
  /audit/events:
    get:
      operationId: getAuditEvents
      summary: Query audit log events
      description: |
        Returns a paginated list of audit events matching the provided filters.
        Reads of the audit log are themselves audited (AUD-09).
      tags: [audit]
      parameters:
        - name: from
          in: query
          required: false
          description: Lower bound of the event timestamp (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Upper bound of the event timestamp (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: agentId
          in: query
          required: false
          description: Filter events by subject agent ID.
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          required: false
          description: Filter events by actor ID.
          schema:
            type: string
        - name: actorType
          in: query
          required: false
          description: Filter events by actor type.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter events by CloudEvent type.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Filter events by action.
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          description: Filter events by outcome.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Filter events by event source.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Keyset pagination cursor from nextCursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A paginated page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        default:
          $ref: "#/components/responses/Problem"
  /audit/events/{id}:
    get:
      operationId: getAuditEvent
      summary: Get an audit event with its Merkle inclusion proof
      description: |
        Retrieves a single audit event by ID with its Merkle tree inclusion proof
        against the latest signed checkpoint. Reads are audited (AUD-09).
      tags: [audit]
      parameters:
        - name: id
          in: path
          required: true
          description: The unique UUID of the audit event.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The audit event and its cryptographic inclusion proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventDetail"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /audit/checkpoints:
    get:
      operationId: getAuditCheckpoints
      summary: List signed checkpoints
      description: Returns stored checkpoints signed over the audit log Merkle tree.
      tags: [audit]
      responses:
        "200":
          description: List of stored signed checkpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditCheckpoint"
        default:
          $ref: "#/components/responses/Problem"
  /audit/keys:
    get:
      operationId: getAuditKeys
      summary: List checkpoint signing keys
      description: Returns public halves of checkpoint signing keys as JWKs.
      tags: [audit]
      responses:
        "200":
          description: List of public checkpoint signing keys as JWKs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
  /agents:
    get:
      operationId: listAgents
      summary: List agents
      description: |
        Lists the agents that match every filter given, ordered by slug, one
        page at a time (INV-09). Whoever may see only active agents, as the
        user role, sees only those.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentStateFilter"
        - $ref: "#/components/parameters/AgentOwnerFilter"
        - $ref: "#/components/parameters/AgentRiskTierFilter"
        - $ref: "#/components/parameters/AgentEnvironmentFilter"
        - $ref: "#/components/parameters/AgentCoverageFilter"
        - $ref: "#/components/parameters/AgentLabelFilter"
        - $ref: "#/components/parameters/AgentUseCaseFilter"
        - $ref: "#/components/parameters/AgentSearch"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: proposeAgent
      summary: Propose an agent
      description: |
        Registers an agent as a draft, lifecycle transition T1, with the
        mandatory metadata of INV-01 and a use case that is not rejected
        (INV-03). The caller, an active human with the owner role, becomes its
        primary owner. A third-party agent without runtime integration is
        registered the same way, with the kind `third_party`, and has coverage
        C0 (INV-07).
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeAgentRequest"
      responses:
        "201":
          description: The new agent.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
  /agents/export:
    get:
      operationId: exportAgents
      summary: Export agents
      description: |
        Streams every agent that matches the filters, as CSV or JSON (INV-09),
        with the visibility of listAgents. It is not paged: it streams its
        rows (plan P1-04, step 9).

        CSV has a header row, then one row per agent, with the columns `id`,
        `slug`, `name`, `description`, `kind`, `source`, `vendor`, `framework`,
        `deploymentLocation`, `environments`, `riskTier`,
        `aiActClassification`, `dataCategories`, `useCaseId`,
        `lifecycleState`, `runState`, `coverage`, `primaryOwnerId`,
        `primaryOwnerName`, `delegateIds`, `labels`, `haltMode`,
        `drillEligible`, `createdAt`, `activatedAt` and `retiredAt`. Lists are
        joined with `;`, and labels are written as `key=value` pairs. A cell,
        or a part of one that follows a `;`, that starts with `=`, `+`, `-`,
        `@`, a tab or a carriage return gets a leading `'`, so that
        spreadsheets never run it as a formula, whatever their list separator
        (threat model, T-09).
      tags: [inventory]
      parameters:
        - name: format
          in: query
          required: false
          description: The format of the export.
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: pseudonymize
          in: query
          required: false
          description: |
            Leaves out the names of people, and keeps their pseudonymous IDs
            (NFR-20): the CSV column `primaryOwnerName` stays empty, and the
            JSON holds no display name.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/AgentStateFilter"
        - $ref: "#/components/parameters/AgentOwnerFilter"
        - $ref: "#/components/parameters/AgentRiskTierFilter"
        - $ref: "#/components/parameters/AgentEnvironmentFilter"
        - $ref: "#/components/parameters/AgentCoverageFilter"
        - $ref: "#/components/parameters/AgentLabelFilter"
        - $ref: "#/components/parameters/AgentUseCaseFilter"
        - $ref: "#/components/parameters/AgentSearch"
      responses:
        "200":
          description: The agents, as CSV or as a JSON array of agents.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}:
    get:
      operationId: getAgent
      summary: Get an agent
      description: |
        Returns an agent, with the ETag that a change to it must send back.
        Every change to the agent changes its ETag, including a change to its
        delegates or to an ownership transfer.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The agent.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: editAgent
      summary: Edit an agent's metadata
      description: |
        Changes the members the request names and keeps the others; an empty
        string clears an optional text member, but an edit that would leave
        neither a vendor nor a framework is refused (`bad_request`, INV-01).
        The agent's owners edit it, and operators edit any agent (permission
        matrix). The slug and the kind never change; the use case changes only
        while the agent is a draft, and never to a rejected one; a retired or
        rejected agent no longer changes (`conflict`). A harness, once
        declared, can be replaced but not removed. A change to what policies
        see of the agent (its risk tier, data categories and labels) or to its
        halt mode takes a new governance state version, so that enforcement
        points learn of it.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditAgentRequest"
      responses:
        "200":
          description: The agent, changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/actions:
    get:
      operationId: getAgentActions
      summary: Get the lifecycle actions open to the caller
      description: |
        Lists the lifecycle actions that the agent's state allows, and whether
        the caller may take each one now. When the caller may not, it says
        what refuses the action: the caller's permission, separation of
        duties, or the guards of the lifecycle that do not hold
        (docs/architecture/lifecycle.md, section 4). The console explains its
        disabled actions with it. The answer holds for the moment it was
        computed: transitionAgent checks everything again.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The actions the agent's state allows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActions"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/transitions:
    get:
      operationId: listAgentTransitions
      summary: List an agent's lifecycle history
      description: |
        Lists the agent's lifecycle transitions, newest first: who made each
        one, with what reason and comment, and the governance state version it
        took (INV-04).
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the agent's transitions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: transitionAgent
      summary: Take a lifecycle action
      description: |
        Takes one lifecycle action on the agent, as the lifecycle
        specification defines it (docs/architecture/lifecycle.md and
        agent-lifecycle.yaml; INV-04). The transitions that White Tower makes
        itself, `mark_ready`, `unmark_ready`, `auto_suspend` and
        `halt_suspend`, cannot be asked for. It needs If-Match with the agent's
        ETag, so that nobody acts on a state they did not see.

        Besides `inventory.view`, each action needs its own permission, within
        its scope (permission matrix): `agent.propose` to submit or withdraw,
        as the agent's primary owner or one of its delegates;
        `usecase.validate` to request changes, reject or validate; and
        `agent.activate`, `agent.suspend`, `agent.reinstate` or `agent.retire`
        for the others. A service account takes only `suspend`: the decisions
        on a proposal (`request_changes`, `reject` and `validate`),
        `activate`, `reinstate` and `retire` are taken by people, whatever
        roles the service account holds. Nobody decides on a proposal, nor
        reinstates an agent, that they own or are a delegate of, or ever
        were, nor one they created or whose use case they created (HUM-04).
        These refusals are `forbidden`. A guard that does not hold answers
        `conflict`, and the detail names it; getAgentActions tells beforehand
        which guards refuse.
        `request_changes`, `reject`, `validate`, `suspend`, `reinstate` and
        `retire` need a comment, and a request without one is refused
        (`bad_request`).

        A use case can justify several agents. `submit`, `withdraw`,
        `request_changes`, `reject` and `validate` change the agent's use case
        too, but only while it is neither validated nor rejected: a validated
        or rejected use case never changes, because other agents may rely on
        it. The decision is then recorded with the agent, and only the agent
        changes state. While the agent's use case is rejected, `submit` and
        `validate` are refused (`conflict`): the owner takes the agent back to
        a draft and links another use case.

        `activate` needs an active owner, a validated use case, an active
        agent-specific policy (POL-04), a declared harness and no halt. Until
        plan P1-06 brings policies, no agent-specific policy is active, so
        `activate` is refused with `agent_policy_active`. `suspend` remembers
        the state the agent was in, and `reinstate` takes it back there once
        its owner is active, no review is overdue, no halt covers it and the
        conditions of that state hold again: an agent suspended from `ready`
        or `active` needs an active agent-specific policy. `retire` cancels
        the agent's pending ownership transfer; retiring a proposal also takes
        it out of the advisory committee's inbox and withdraws its use case,
        as `withdraw` does.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: The agent, in its new state.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/instances:
    get:
      operationId: listAgentInstances
      summary: List an agent's instances
      description: |
        Lists the module instances that serve the agent, as enforcement points
        and other modules report them through the module API, latest
        connection first. The inventory only reads them: plan P1-07 records
        them.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the agent's instances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceList"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/owners:
    get:
      operationId: listAgentOwners
      summary: List an agent's owners and their history
      description: |
        Lists the agent's primary owner and delegates (INV-02): the current
        assignments first, then those that ended, each the latest assigned
        first.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the agent's owner assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerAssignmentList"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/primary-owner:
    put:
      operationId: reassignAgentOwner
      summary: Reassign an agent's primary owner
      description: |
        Makes another active human with the owner role the agent's primary
        owner at once, for a reason (INV-02): the advisory committee and
        operators do it, for example after an owner left
        (`agent.ownership.reassign`). The former primary owner's assignment
        ends, the new owner stops being a delegate if they were one, and a
        pending ownership transfer is cancelled. It needs If-Match with the
        agent's ETag, and takes a new governance state version, because
        policies see the owner.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignOwnerRequest"
      responses:
        "200":
          description: The agent, with its new primary owner.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/delegates:
    post:
      operationId: addAgentDelegate
      summary: Add a delegate
      description: |
        Makes an active human with the owner role a delegate of the agent: the
        owner role's `own` grants then let them act for its owner (INV-02).
        Anyone else is refused (`bad_request`). The agent's owners and
        operators manage its delegates (`agent.metadata.edit`). The agent's
        ETag changes.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDelegateRequest"
      responses:
        "201":
          description: The delegate's assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerAssignment"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/delegates/{principalId}:
    delete:
      operationId: removeAgentDelegate
      summary: Remove a delegate
      description: |
        Ends the principal's assignment as a delegate of the agent, for a
        reason; the history keeps it. The agent's owners and operators manage
        its delegates (`agent.metadata.edit`). The agent's ETag changes.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/DelegateId"
        - name: reason
          in: query
          required: false
          description: Why the assignment ends. A request without a reason is refused (`bad_request`).
          schema:
            type: string
            maxLength: 1000
      responses:
        "204":
          description: The delegate was removed.
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/ownership-transfers:
    post:
      operationId: requestOwnershipTransfer
      summary: Offer an agent's ownership to someone else
      description: |
        Starts a transfer of the agent's primary ownership to another active
        human with the owner role, who must accept it (INV-02): it waits in
        their inbox. Anyone else is refused (`bad_request`). Only the primary
        owner starts one, and an agent has one pending transfer at most. The
        agent's ETag changes.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOwnershipTransferRequest"
      responses:
        "201":
          description: The pending transfer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipTransfer"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/ownership-transfers/{transferId}:
    delete:
      operationId: cancelOwnershipTransfer
      summary: Cancel an ownership transfer
      description: |
        Cancels a pending transfer. The primary owner who started it, or an
        operator, cancels it (`agent.metadata.edit`). The agent's ETag
        changes.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/TransferId"
      responses:
        "204":
          description: The transfer was cancelled.
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/ownership-transfers/{transferId}/accept:
    post:
      operationId: acceptOwnershipTransfer
      summary: Accept an ownership transfer
      description: |
        The principal that a pending transfer names accepts it, and becomes
        the agent's primary owner; they need the owner role
        (`agent.propose`). The former primary owner's assignment ends, the
        agent's ETag changes, and the agent takes a new governance state
        version, because policies see the owner.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/TransferId"
      responses:
        "200":
          description: The accepted transfer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipTransfer"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/ownership-transfers/{transferId}/decline:
    post:
      operationId: declineOwnershipTransfer
      summary: Decline an ownership transfer
      description: The principal that a pending transfer names declines it; the agent keeps its primary owner, and its ETag changes.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/TransferId"
      responses:
        "200":
          description: The declined transfer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipTransfer"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/reviews:
    get:
      operationId: listAgentReviews
      summary: List an agent's periodic reviews
      description: Lists the agent's periodic reviews (INV-06), the latest due first.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the agent's reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
        default:
          $ref: "#/components/responses/Problem"
  /use-cases:
    get:
      operationId: listUseCases
      summary: List use cases
      description: |
        Lists the use cases that match every filter given, newest first.
        Whoever may see only active agents sees only the use cases of active
        agents.
      tags: [inventory]
      parameters:
        - name: status
          in: query
          required: false
          description: Use cases in any of these statuses.
          schema:
            type: array
            maxItems: 5
            items:
              $ref: "#/components/schemas/UseCaseStatus"
        - name: q
          in: query
          required: false
          description: Text to look for in the title and the description.
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of use cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseCaseList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUseCase
      summary: Create a use case
      description: |
        Creates a use case as a draft: the business purpose that justifies one
        or more agents (INV-03). Owners create them (`agent.propose`). The
        advisory committee decides on a use case through the lifecycle of the
        agents it justifies (transitionAgent).
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUseCaseRequest"
      responses:
        "201":
          description: The new use case.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseCase"
        default:
          $ref: "#/components/responses/Problem"
  /use-cases/{id}:
    get:
      operationId: getUseCase
      summary: Get a use case
      description: Returns a use case, with the ETag that a change to it must send back.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/UseCaseId"
      responses:
        "200":
          description: The use case.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseCase"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: editUseCase
      summary: Edit a use case
      description: |
        Changes the members the request names and keeps the others; an empty
        string clears an optional text member. The use case's creator edits it
        (`agent.propose`) while it is a draft or changes were requested, and
        no agent it justifies waits for a decision; otherwise the edit is
        refused (`conflict`), so that the committee decides on what it read.
        To change a use case under review, its owner withdraws the proposal.
        A validated or rejected use case never changes, because the agents it
        justifies rely on what the committee decided: a new use case replaces
        it.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/UseCaseId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditUseCaseRequest"
      responses:
        "200":
          description: The use case, changed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseCase"
        default:
          $ref: "#/components/responses/Problem"
  /use-cases/{id}/decisions:
    get:
      operationId: listUseCaseDecisions
      summary: List the decisions on a use case
      description: |
        Lists the advisory committee's decisions on the use case, newest
        first: validations, rejections and requests for changes, each with its
        comment and the agent whose proposal it decided.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/UseCaseId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseCaseDecisionList"
        default:
          $ref: "#/components/responses/Problem"
  /reviews:
    get:
      operationId: listReviews
      summary: List periodic reviews
      description: |
        Lists the periodic reviews of every agent the caller may see that
        match the filters, the earliest due first: for example the overdue
        reviews of the dashboard (UI-08), or those waiting for sign-off.
      tags: [inventory]
      parameters:
        - name: status
          in: query
          required: false
          description: Reviews in any of these statuses.
          schema:
            type: array
            maxItems: 4
            items:
              $ref: "#/components/schemas/ReviewStatus"
        - name: overdue
          in: query
          required: false
          description: Only the open reviews past their due date, or only the others.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewList"
        default:
          $ref: "#/components/responses/Problem"
  /reviews/{id}:
    get:
      operationId: getReview
      summary: Get a periodic review
      description: |
        Returns a periodic review, with the ETag that its completion or
        sign-off must send back. An open review lists, as candidates to
        disable, the enabled tools and models that the agent has not used
        within the setting `lifecycle.review_unused_tooling_days` (CAT-09),
        to the callers who may view agents' tooling (permission matrix: not
        the user role, and never a break-glass session).
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: The review.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Problem"
  /reviews/{id}/completion:
    post:
      operationId: completeReview
      summary: Complete a periodic review
      description: |
        Records the owner's attestation (INV-06): the agent is still needed,
        its owner is still right, its data categories are current, its policy
        is still adequate and its enabled tooling is still needed. The
        attestation names the candidates to disable that the owner keeps,
        among those the review lists now; the owner disables the others in
        the agent's tooling (plan P1-16). A person who is the agent's primary
        owner or a delegate completes it (`agent.review`), while the agent is
        active or suspended. When the review needs a sign-off
        (`signoffRequired`), it then waits for one; otherwise it is completed
        and the next review is scheduled. It needs If-Match with the review's
        ETag.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/ReviewId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAttestation"
      responses:
        "200":
          description: The review, completed or waiting for its sign-off.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Problem"
  /reviews/{id}/sign-off:
    post:
      operationId: signOffReview
      summary: Sign off a periodic review
      description: |
        A member of the advisory committee signs off a review that waits for
        it, whatever the agent's risk tier: the review's `signoffRequired`,
        set from the setting `lifecycle.review_signoff_risk_tiers`, decides
        (`agent.review`). The signer is a person, and neither the one who
        completed the review, nor anyone who is or ever was the agent's
        primary owner or one of its delegates, nor the creator of the agent
        or of its use case (HUM-04). The review is then completed, and the
        next one scheduled. It needs If-Match with the review's ETag.
      tags: [inventory]
      parameters:
        - $ref: "#/components/parameters/ReviewId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The completed review.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        default:
          $ref: "#/components/responses/Problem"
  /data-categories:
    get:
      operationId: listDataCategories
      summary: List the data categories
      description: |
        Lists the categories of data that agents and use cases may name: the
        setting `inventory.data_categories`, which administrators edit. They
        are keys, which the console translates; it shows a key it does not
        know as it is.
      tags: [inventory]
      responses:
        "200":
          description: The data categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataCategoryList"
        default:
          $ref: "#/components/responses/Problem"
  /inbox:
    get:
      operationId: listInboxItems
      summary: List the caller's pending work
      description: |
        Lists the open items addressed to the caller, or to one of the
        caller's roles, newest first (UI-09): proposals waiting for
        validation, reviews due, sign-offs and ownership transfers, and the
        kinds of later plans, such as policy approvals, halt releases and
        catalog requests. An item leaves every inbox once someone handles it.
        Nobody sees the items about a proposal they may not decide on: one
        they own, are a delegate of or created, or one whose use case they
        created (HUM-04).
      tags: [inbox]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of inbox items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItemList"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/servers:
    get:
      operationId: listCatalogServers
      summary: List MCP servers
      description: |
        Lists the MCP servers of the catalog that match every filter given,
        ordered by key, one page at a time (CAT-02). Their references,
        announced names, versions and display forms were reported by agents:
        they are untrusted text, shown as plain text, and only to the callers
        who may view the catalog (`catalog.view`).
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogStatusFilter"
        - $ref: "#/components/parameters/CatalogPendingReviewFilter"
        - $ref: "#/components/parameters/CatalogFlagFilter"
        - $ref: "#/components/parameters/CatalogKeyFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of MCP servers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServerList"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/servers/{id}:
    get:
      operationId: getCatalogServer
      summary: Get an MCP server
      description: Returns an MCP server of the catalog, with the ETag that its approval or decline must send back.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogServerId"
      responses:
        "200":
          description: The MCP server.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServer"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/servers/{id}/approve:
    post:
      operationId: approveCatalogServer
      summary: Approve an MCP server
      description: |
        Approves a discovered MCP server for the whole organization
        (`catalog.entry.approve`, the advisory committee). Its key never
        changes afterwards. The request can approve some of the server's
        tools at once: each names the definition hash the reviewer saw in
        full, its classification and the arguments policies may see, as
        approveCatalogTool does, and the whole request is refused if one of
        them is. Approving never enables anything for an agent (CAT-03). It
        needs If-Match with the server's ETag.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogServerId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveCatalogServerRequest"
      responses:
        "200":
          description: The approved MCP server.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServer"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/servers/{id}/decline:
    post:
      operationId: declineCatalogServer
      summary: Decline an MCP server
      description: |
        Declines a discovered MCP server, with a reason
        (`catalog.entry.approve`). It leaves the queue of what waits for
        review and stays discovered, so its tools stay denied; it can still
        be approved later. An approved server cannot be declined
        (`conflict`): a block or disables restrict it at once. It needs
        If-Match with the server's ETag.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogServerId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: The declined MCP server.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogServer"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/tools:
    get:
      operationId: listCatalogTools
      summary: List tools
      description: |
        Lists the tools of the catalog that match every filter given, ordered
        by key, one page at a time (CAT-02). The agent's own tools
        (`agent/<name>`) are entries of their agent, so two of them can share
        a key: filter them by agent. Names were reported by agents, and are
        untrusted text.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogStatusFilter"
        - $ref: "#/components/parameters/CatalogPendingReviewFilter"
        - $ref: "#/components/parameters/CatalogKeyFilter"
        - name: serverId
          in: query
          required: false
          description: The tools of this MCP server.
          schema:
            type: string
            format: uuid
        - name: agentId
          in: query
          required: false
          description: The own tools of this agent.
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: false
          description: Tools of any of these kinds.
          schema:
            type: array
            maxItems: 5
            items:
              $ref: "#/components/schemas/ToolKind"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of tools.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogToolList"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/tools/{id}:
    get:
      operationId: getCatalogTool
      summary: Get a tool
      description: |
        Returns a tool of the catalog: its pinned definition hash, the
        definitions that wait for review, its classification and the
        arguments policies may see, with the ETag that its approval or
        decline must send back. getToolDefinition returns each definition in
        full.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogToolId"
      responses:
        "200":
          description: The tool.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogTool"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/tools/{id}/approve:
    post:
      operationId: approveCatalogTool
      summary: Approve a tool or a new definition
      description: |
        Approves a discovered tool, or one of the definitions of an approved
        tool that wait for review, for the whole organization
        (`catalog.entry.approve`, the advisory committee). It pins the
        definition hash the request names, which must be one of the tool's
        reported definitions that the core stores; a built-in tool has none,
        and a tool of any other kind without a definition hash is never
        approved (`conflict`, contracts section 7.7). A tool of an MCP server
        is approved only once its server is (`conflict`). The reviewer
        classifies the tool, starting from its MCP annotations or, without
        them, from the protocol's conservative defaults (not read-only,
        destructive, open world), and declares the arguments policies may
        see, with their types from the tool's input schema (RFC-0002, section
        7.5). For an approved tool, a request that names its pinned
        definition changes only its classification and declared arguments;
        a declaration that an active policy version reads cannot be
        withdrawn, and a declared argument's type cannot change while an
        active usage rule uses it (`conflict`). Approving never
        enables anything for an agent (CAT-03). It needs If-Match with the
        tool's ETag.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogToolId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogToolApproval"
      responses:
        "200":
          description: The approved tool.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogTool"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/tools/{id}/decline:
    post:
      operationId: declineCatalogTool
      summary: Decline a tool or a new definition
      description: |
        Declines, with a reason (`catalog.entry.approve`), the definition
        that the request names, which waits for review, or, without one, a
        discovered tool and every definition of it that waits. What is
        declined leaves the queue of what waits for review and stays not
        approved, so it stays denied; it can still be approved later. A
        declined definition reported again does not return to the queue. An
        approved tool keeps its pinned definition. It needs If-Match with the
        tool's ETag.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogToolId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineCatalogToolRequest"
      responses:
        "200":
          description: The tool, with what was declined.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogTool"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/definitions/{sha256}:
    get:
      operationId: getToolDefinition
      summary: Get a tool definition
      description: |
        Returns a tool definition that the core stores, for review and diffs:
        the members that its hash covers (contracts, section 4.10), as the
        bytes of their canonical JSON, exactly as stored, so that the
        SHA-256 of the body is the hash in the path. The definition was
        reported by an agent: it is untrusted text, which the console shows
        as plain text. It is served only as `application/json`, with
        `X-Content-Type-Options: nosniff` and the API's
        `Content-Security-Policy: default-src 'none'`, never as HTML. The
        core stores no member over the limits of a report (a name and a
        title of 256 bytes, a description of 16 KiB, each schema of 64 KiB,
        annotations of 4 KiB), so a body is never larger than 1 MiB, JSON
        escapes included.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/DefinitionSha256"
      responses:
        "200":
          description: The definition, as stored.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolDefinition"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/models:
    get:
      operationId: listCatalogModels
      summary: List models
      description: |
        Lists the models of the catalog that match every filter given,
        ordered by key, one page at a time (CAT-02). Their endpoints and
        names were reported by agents, and are untrusted text.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogStatusFilter"
        - $ref: "#/components/parameters/CatalogPendingReviewFilter"
        - $ref: "#/components/parameters/CatalogFlagFilter"
        - $ref: "#/components/parameters/CatalogKeyFilter"
        - name: provider
          in: query
          required: false
          description: The models of this provider (contracts, section 6.3).
          schema:
            type: string
            maxLength: 128
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogModelList"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/models/{id}:
    get:
      operationId: getCatalogModel
      summary: Get a model
      description: Returns a model of the catalog, with the ETag that its approval or decline must send back.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogModelId"
      responses:
        "200":
          description: The model.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogModel"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/models/{id}/approve:
    post:
      operationId: approveCatalogModel
      summary: Approve a model or a new digest
      description: |
        Approves a discovered model, or one of the digests of an approved
        model that wait for review, for the whole organization
        (`catalog.entry.approve`, the advisory committee). It pins the
        digest of the weights that the request names, which must be one that
        the model's runtime reported; a model whose runtime reports no digest
        is approved without one. Approving never enables anything for an
        agent (CAT-03). It needs If-Match with the model's ETag.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogModelId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveCatalogModelRequest"
      responses:
        "200":
          description: The approved model.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogModel"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/models/{id}/decline:
    post:
      operationId: declineCatalogModel
      summary: Decline a model or a new digest
      description: |
        Declines, with a reason (`catalog.entry.approve`), the digest that
        the request names, which waits for review, or, without one, a
        discovered model and every digest of it that waits. What is declined
        leaves the queue of what waits for review and stays denied; it can
        still be approved later. An approved model keeps its pinned digest.
        It needs If-Match with the model's ETag.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogModelId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineCatalogModelRequest"
      responses:
        "200":
          description: The model, with what was declined.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogModel"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/declines:
    post:
      operationId: declinePendingFromAgent
      summary: Decline everything an agent brought that waits for review
      description: |
        Declines at once, with a reason, every entry, definition and digest
        that the agent's reports brought and that still waits for review
        (`catalog.entry.approve`): the answer to an agent that floods the
        queue (threat model, T-74). What is declined stays denied, and frees
        the agent's room for what waits for review (CORE-13). Approved
        entries keep what they pinned.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclinePendingFromAgentRequest"
      responses:
        "200":
          description: How much was declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDeclineSummary"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/blocks:
    get:
      operationId: listCatalogBlocks
      summary: List blocks
      description: |
        Lists organization-wide blocks, the latest issued first, with their
        spread to enforcement points (CAT-04): the active ones by default.
        What a block covers is shown in clear only here, to the callers who
        may view the catalog. The design of blocks is reserved for the halt
        path's review (plan P1-16, step 7), which may change this operation.
      tags: [catalog]
      parameters:
        - name: status
          in: query
          required: false
          description: The blocks in this status.
          schema:
            type: string
            enum: [active, lifted]
            default: active
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogBlockList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: issueCatalogBlock
      summary: Block a server, a tool or models
      description: |
        Blocks, for the whole organization and at once, with a reason, an MCP
        server and its tools, a tool, a model, every model of a provider or
        every model of an endpoint (CAT-04; `catalog.block.issue`). The block
        names what it covers by reference, so it also covers what the
        catalog has not seen yet; enforcement points receive the SHA-256 of
        the reference in the watch stream, without a new bundle. It takes a
        governance state version. At most 500 blocks are active, and one
        more is refused (`conflict`), as is a second active block of the same
        kind and reference. A block never changes an entry's status. The
        design of blocks is reserved for the halt path's review (plan P1-16,
        step 7), which may change this operation.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCatalogBlockRequest"
      responses:
        "201":
          description: The block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogBlock"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/blocks/{id}:
    get:
      operationId: getCatalogBlock
      summary: Get a block
      description: |
        Returns a block, with its spread to enforcement points and its
        pending unblock request. The design of blocks is reserved for the
        halt path's review (plan P1-16, step 7), which may change this
        operation.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogBlockId"
      responses:
        "200":
          description: The block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogBlock"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/blocks/{id}/unblock-requests:
    post:
      operationId: requestCatalogUnblock
      summary: Request that a block be lifted
      description: |
        Asks, with a reason, that an active block be lifted
        (`catalog.unblock.request`). Someone else on the steering or the
        advisory committee approves it (HUM-04). A block has one pending
        request at most (`conflict`). The design of blocks is reserved for
        the halt path's review (plan P1-16, step 7), which may change this
        operation.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogBlockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogUnblockRequest"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/blocks/{id}/unblock-requests/{requestId}/approve:
    post:
      operationId: approveCatalogUnblock
      summary: Approve lifting a block
      description: |
        Approves a pending unblock request, and lifts the block in a
        governance state version of its own (`catalog.unblock.approve`).
        Nobody approves their own request (`forbidden`, HUM-04, ST-81), and
        the database refuses it too. Lifting a block leaves every entry as it
        was. The design of blocks is reserved for the halt path's review
        (plan P1-16, step 7), which may change this operation.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogBlockId"
        - $ref: "#/components/parameters/UnblockRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: The lifted block.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogBlock"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/blocks/{id}/unblock-requests/{requestId}/decline:
    post:
      operationId: declineCatalogUnblock
      summary: Decline lifting a block
      description: |
        Declines a pending unblock request, with a reason
        (`catalog.unblock.approve`): the block stays active, and can take
        another request. A decline only denies, so the requester may decline
        their own request. The design of blocks is reserved for the halt
        path's review (plan P1-16, step 7), which may change this operation.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/CatalogBlockId"
        - $ref: "#/components/parameters/UnblockRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: The declined request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogUnblockRequest"
        default:
          $ref: "#/components/responses/Problem"
  /catalog/usage-rules/compile:
    post:
      operationId: compileUsageRules
      summary: Compile usage rules into Cedar
      description: |
        Writes the Cedar statements of a policy's usage rules, as the core's
        check at submission regenerates them, for the console's forms and for
        policy-as-code repositories (RFC-0002, section 8; contracts, section
        6.11). It writes exactly what the reference generator of the
        conformance kit writes (`test/conformance/profile`, `GenerateRules`),
        and refuses what it refuses (`bad_request`, with the reason): for
        each rule, and for each of its tools in their order, its
        `tool.invoke` statement, then its `tool.expose` statement. A global
        policy's rules take the arguments that the catalog declares, and
        cannot name an agent's own tool (`agent/<name>`); an agent-specific
        policy's take those of the agent's catalog. The rules are given as
        JSON text, as their annotations carry them, so that the generator
        reads exactly what a policy would hold: a repeated member name, a
        lone surrogate or an integer beyond 64 bits is refused rather than
        read another way. The text is at most 256 KiB, and statements that
        would exceed 2 MiB, the limit of a whole bundle (contracts, step V1),
        are refused before they are written. Compiling changes nothing.
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileUsageRulesRequest"
      responses:
        "200":
          description: The Cedar statements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompiledUsageRules"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/tooling:
    get:
      operationId: listAgentTooling
      summary: List an agent's tooling
      description: |
        Lists the MCP servers, tools and models observed, enabled or declared
        for the agent, ordered by kind and key, one page at a time (UI-10):
        for each, whether it is enabled and declared, and each observation,
        with its source, its origin and when it was first and last seen. An
        entry that the agent no longer has stays listed while it is enabled.
        Observations were reported by the agent's enforcement points, and are
        untrusted.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: entryType
          in: query
          required: false
          description: Entries of this kind.
          schema:
            $ref: "#/components/schemas/CatalogEntryType"
        - name: enabled
          in: query
          required: false
          description: Only the enabled entries, or only the others.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the agent's tooling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentToolingList"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/tooling/disable:
    post:
      operationId: disableAgentTooling
      summary: Disable an agent's tooling
      description: |
        Disables, at once and with a reason, tools and models enabled for the
        agent; naming an MCP server disables its tools (CAT-03). The agent's
        owners disable it, and the advisory committee and operators disable
        any agent's (`tooling.disable`). It takes no If-Match: a disable only
        restricts, and never waits on a version. An entry that is not
        enabled is left out of the answer. Enabling again needs a new
        request. The agent's next bundle no longer lists the entry as
        enabled.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableAgentToolingRequest"
      responses:
        "200":
          description: The entries disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolingEntryRefList"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/tooling-requests:
    get:
      operationId: listAgentToolingRequests
      summary: List an agent's requests to enable tooling
      description: Lists the agent's requests to enable tools and models, newest first, with their decisions.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: status
          in: query
          required: false
          description: Requests in any of these statuses.
          schema:
            type: array
            maxItems: 3
            items:
              $ref: "#/components/schemas/CatalogRequestStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolingRequestList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestAgentTooling
      summary: Request enabling tooling for an agent
      description: |
        Asks, with a reason, that an approved tool or model be enabled for
        the agent; naming an approved MCP server asks for its approved tools
        at once (CAT-03). The agent's owners ask for their agents, and the
        advisory committee for any (`tooling.enable.request`). Someone else
        on the advisory committee approves it (HUM-04). An entry that is not
        approved, an agent that is retired or rejected, and a second pending
        request for the same entry are refused (`conflict`). The request
        waits in the advisory committee's inbox.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAgentToolingRequest"
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolingRequest"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/tooling-requests/{requestId}/approve:
    post:
      operationId: approveAgentToolingRequest
      summary: Approve a request to enable tooling
      description: |
        Approves a pending request, and enables what it names for the agent
        (`tooling.enable.approve`, the advisory committee). Nobody approves
        their own request (`forbidden`, HUM-04, ST-81), and the database
        refuses it too. An entry that is no longer approved, or an agent that
        was retired or rejected since, is refused (`conflict`). A request is
        decided once, and never changes afterwards.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/ToolingRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: The approved request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolingRequest"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/tooling-requests/{requestId}/decline:
    post:
      operationId: declineAgentToolingRequest
      summary: Decline a request to enable tooling
      description: |
        Declines a pending request, with a reason
        (`tooling.enable.approve`): nothing is enabled. A decline only
        denies, so the requester may decline their own request. A request is
        decided once, and never changes afterwards.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/ToolingRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: The declined request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolingRequest"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{id}/declared-tooling:
    get:
      operationId: getAgentDeclaredTooling
      summary: Get an agent's declared tooling
      description: |
        Returns the tooling that people declared for the agent, with the ETag
        that a new declaration must send back. An agent without a
        declaration has an empty one.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The declared tooling.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredTooling"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: declareAgentTooling
      summary: Declare an agent's tooling
      description: |
        Replaces the tooling declared for an agent without an enforcement
        point, so that the inventory is complete (CAT-08): the agent's owners
        declare it, and operators declare any agent's (`tooling.declare`).
        Nothing enforces it, and a declaration never approves, enables or
        unblocks anything (CORE-10): what the catalog lacks becomes a
        discovered entry. It takes the shape and the limits of a tooling
        report (contracts, section 4.10), and is accepted only for an agent
        below coverage C2 (`conflict`). It needs If-Match with the ETag of
        getAgentDeclaredTooling.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareToolingRequest"
      responses:
        "200":
          description: The declared tooling.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredTooling"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-wt_session
      description: |
        The console's session, which the login under /auth sets
        (ADR-0009). State-changing requests also send the session's CSRF
        token in a header.
    apiToken:
      type: http
      scheme: bearer
      description: An API token, prefixed `wt_pat_`, for the CLI and the organization's tools.
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  parameters:
    AgentId:
      name: id
      in: path
      required: true
      description: The agent's ID.
      schema:
        type: string
        format: uuid
    UseCaseId:
      name: id
      in: path
      required: true
      description: The use case's ID.
      schema:
        type: string
        format: uuid
    ReviewId:
      name: id
      in: path
      required: true
      description: The review's ID.
      schema:
        type: string
        format: uuid
    TransferId:
      name: transferId
      in: path
      required: true
      description: The ownership transfer's ID.
      schema:
        type: string
        format: uuid
    DelegateId:
      name: principalId
      in: path
      required: true
      description: The delegate's principal ID.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Where the page starts, as the previous page returned it in `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: The page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The ETag of the version the change applies to (API-03). A change
        without it is refused with `precondition_required`, and one with an
        ETag that is no longer current with `precondition_failed` (threat
        model, T-08).
      schema:
        type: string
    AgentStateFilter:
      name: state
      in: query
      required: false
      description: Agents in any of these lifecycle states.
      schema:
        type: array
        maxItems: 8
        items:
          $ref: "#/components/schemas/LifecycleState"
    AgentOwnerFilter:
      name: ownerId
      in: query
      required: false
      description: Agents whose primary owner or one of whose delegates is this principal.
      schema:
        type: string
        format: uuid
    AgentRiskTierFilter:
      name: riskTier
      in: query
      required: false
      description: Agents in any of these risk tiers.
      schema:
        type: array
        maxItems: 4
        items:
          $ref: "#/components/schemas/RiskTier"
    AgentEnvironmentFilter:
      name: environment
      in: query
      required: false
      description: Agents deployed in this environment.
      schema:
        type: string
        maxLength: 63
    AgentCoverageFilter:
      name: coverage
      in: query
      required: false
      description: Agents at any of these coverage levels.
      schema:
        type: array
        maxItems: 4
        items:
          $ref: "#/components/schemas/CoverageLevel"
    AgentLabelFilter:
      name: label
      in: query
      required: false
      description: Agents that carry every one of these labels, each written as `key=value`.
      schema:
        type: array
        maxItems: 16
        items:
          type: string
          maxLength: 320
    AgentUseCaseFilter:
      name: useCaseId
      in: query
      required: false
      description: Agents that this use case justifies.
      schema:
        type: string
        format: uuid
    AgentSearch:
      name: q
      in: query
      required: false
      description: Text to look for in the slug, the name and the description.
      schema:
        type: string
        maxLength: 200
    CatalogServerId:
      name: id
      in: path
      required: true
      description: The MCP server's ID.
      schema:
        type: string
        format: uuid
    CatalogToolId:
      name: id
      in: path
      required: true
      description: The tool's ID.
      schema:
        type: string
        format: uuid
    CatalogModelId:
      name: id
      in: path
      required: true
      description: The model's ID.
      schema:
        type: string
        format: uuid
    CatalogBlockId:
      name: id
      in: path
      required: true
      description: The block's ID.
      schema:
        type: string
        format: uuid
    UnblockRequestId:
      name: requestId
      in: path
      required: true
      description: The unblock request's ID.
      schema:
        type: string
        format: uuid
    ToolingRequestId:
      name: requestId
      in: path
      required: true
      description: The request's ID.
      schema:
        type: string
        format: uuid
    DefinitionSha256:
      name: sha256
      in: path
      required: true
      description: The definition hash, the lowercase hexadecimal SHA-256 of the definition's canonical JSON (contracts, section 4.10).
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    CatalogStatusFilter:
      name: status
      in: query
      required: false
      description: Entries in any of these statuses.
      schema:
        type: array
        maxItems: 2
        items:
          $ref: "#/components/schemas/CatalogStatus"
    CatalogPendingReviewFilter:
      name: pendingReview
      in: query
      required: false
      description: Only the entries that wait for review, themselves or by a new definition or digest, or only the others.
      schema:
        type: boolean
    CatalogFlagFilter:
      name: flag
      in: query
      required: false
      description: Entries that carry every one of these flags.
      schema:
        type: array
        maxItems: 8
        items:
          $ref: "#/components/schemas/CatalogFlag"
    CatalogKeyFilter:
      name: key
      in: query
      required: false
      description: The entry with this key, matched exactly. Keys hold slashes, so they are filters rather than paths.
      schema:
        type: string
        maxLength: 512
  headers:
    ETag:
      description: A strong tag of the resource's version, which a change to it sends back in If-Match (API-03).
      required: true
      schema:
        type: string
    ContentDisposition:
      description: The name to save the export as, `agents.csv` or `agents.json`.
      required: false
      schema:
        type: string
  schemas:
    VersionInfo:
      type: object
      additionalProperties: false
      required: [version, commit, apiVersion]
      properties:
        version:
          type: string
          description: Release version, or `dev` for local builds.
        commit:
          type: string
          description: Git commit the binary was built from, or `unknown`.
        apiVersion:
          type: string
          description: Version of this API.
          enum: [v1]
    Principal:
      type: object
      additionalProperties: false
      required: [id, kind, displayName, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: The principal's identifier.
        kind:
          type: string
          enum: [human, service_account]
        displayName:
          type: string
        roles:
          type: array
          description: The roles bound to the principal (requirements, permission matrix).
          items:
            type: string
        permissions:
          type: array
          description: The permissions granted by the principal's roles (permission matrix).
          items:
            type: string
        csrfToken:
          type: string
          description: The session's CSRF token for state-changing requests, if authenticated via session.
        isBreakglass:
          type: boolean
          description: True if authenticated via emergency break-glass session.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. `type` and `code` identify the error;
        `title` is the same for every occurrence of it, and `detail`
        explains this one. No internal detail reaches the client.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Identifies the error, and links to its documentation.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: This occurrence, as `urn:uuid:` followed by the request ID, which the logs record.
        code:
          type: string
          description: The stable error code.
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Friendly name for the token.
        scopes:
          type: array
          minItems: 1
          items:
            type: string
          description: The permissions granted to the token (must be subset of effective permissions).
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
          description: Lifetime of the token in days (max 90).
        principalId:
          type: string
          format: uuid
          description: Optional principal ID to issue the token for (a service account that the caller is responsible for, or any principal for a holder of `identity.tokens.manage`).
    CreatedToken:
      type: object
      additionalProperties: false
      required: [id, principalId, name, tokenPrefix, scopes, token, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        name:
          type: string
        tokenPrefix:
          type: string
          description: The prefix of the token, useful for identification.
        scopes:
          type: array
          items:
            type: string
        token:
          type: string
          description: The raw plaintext API token. It is only returned once and never stored.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ApiTokenMetadata:
      type: object
      additionalProperties: false
      required: [id, principalId, name, tokenPrefix, scopes, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        name:
          type: string
        tokenPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [displayName, roles]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          nullable: true
        roles:
          type: array
          minItems: 1
          items:
            type: string
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, displayName, status, responsiblePrincipalId, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        responsiblePrincipalId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    ExchangeTokenRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Raw OpenID Connect ID token obtained by the CLI.
    EmergencyRevocationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why everything ends, such as a reference to the incident. The audit log keeps it.
    EmergencyRevocation:
      type: object
      additionalProperties: false
      required: [sessions, tokens, revokedAt]
      properties:
        sessions:
          type: integer
          format: int64
          minimum: 0
          description: How many sessions it revoked, of those not revoked before, expired ones included.
        tokens:
          type: integer
          format: int64
          minimum: 0
          description: How many API tokens it revoked, of those not revoked before, expired ones included.
        revokedAt:
          type: string
          format: date-time
          description: When it ended them. A session or a token created later was not ended.
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, time, source, type, ingestedAt, data, canonical]
      properties:
        id:
          type: string
          format: uuid
        time:
          type: string
          format: date-time
        source:
          type: string
        type:
          type: string
        subject:
          type: string
          nullable: true
        actorType:
          type: string
          nullable: true
        actorId:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        outcome:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true
        traceId:
          type: string
          nullable: true
        ingestedAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
        canonical:
          type: string
          description: Canonical RFC 8785 JSON representation of the CloudEvent.
    AuditEventList:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
          nullable: true
    AuditInclusionProof:
      type: object
      additionalProperties: false
      required: [leafIndex, treeSize, rootHash, hashes, checkpoint]
      properties:
        leafIndex:
          type: integer
          format: int64
        treeSize:
          type: integer
          format: int64
        rootHash:
          type: string
          description: Base64-encoded 32-byte Merkle root hash.
        hashes:
          type: array
          items:
            type: string
          description: Base64-encoded 32-byte hashes forming the audit path.
        checkpoint:
          type: string
          description: Signed C2SP checkpoint note against which proof holds.
    AuditEventDetail:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/AuditEvent"
        proof:
          $ref: "#/components/schemas/AuditInclusionProof"
          nullable: true
    AuditCheckpoint:
      type: object
      additionalProperties: false
      required: [treeSize, rootHash, keyId, note, createdAt]
      properties:
        treeSize:
          type: integer
          format: int64
        rootHash:
          type: string
          description: Base64-encoded 32-byte Merkle root hash.
        keyId:
          type: string
        note:
          type: string
          description: Complete signed note in C2SP format.
        createdAt:
          type: string
          format: date-time
    LifecycleState:
      type: string
      description: Where the agent is in its lifecycle (docs/architecture/lifecycle.md, section 1).
      enum: [draft, proposed, validated, ready, active, suspended, retired, rejected]
    RunState:
      type: string
      description: |
        Whether the agent may act now, or a halt of the agent or of the fleet
        stops it, whatever its lifecycle state (lifecycle, section 2).
      enum: [running, halted]
    AgentKind:
      type: string
      description: Whether the organization builds the agent, or uses a third party's (INV-01).
      enum: [in_house, third_party]
    RiskTier:
      type: string
      description: |
        The agent's risk tier. It sets how often the agent is reviewed,
        whether its reviews need a sign-off, and the lease of its enforcement
        points.
      enum: [low, medium, high, critical]
    AiActClassification:
      type: string
      description: The classification under the EU AI Act. A use case classified `prohibited` is never validated.
      enum: [prohibited, high_risk, limited, minimal, not_assessed]
    HaltMode:
      type: string
      description: How the agent's enforcement points stop it when it is halted (module contracts, section 5).
      enum: [block, interrupt, terminate]
    CoverageLevel:
      type: string
      description: |
        How deeply White Tower governs the agent (INV-08): C0, declared in the
        inventory; C1, it authenticates with White Tower credentials; C2, an
        enforcement point governs it and reports its decisions; C3, a halt or
        a drill of it was confirmed within the configured period.
      enum: [C0, C1, C2, C3]
    SuspensionReason:
      type: string
      description: Why the agent was suspended (lifecycle, transitions T10 to T12).
      enum: [manual, owner_inactive, review_overdue, halt]
    LifecycleAction:
      type: string
      description: An action of the lifecycle, as agent-lifecycle.yaml names it.
      enum:
        - create
        - submit
        - withdraw
        - request_changes
        - reject
        - validate
        - mark_ready
        - unmark_ready
        - activate
        - suspend
        - auto_suspend
        - halt_suspend
        - reinstate
        - retire
    RequestedAction:
      type: string
      description: A lifecycle action that people take; White Tower takes the others itself.
      enum: [submit, withdraw, request_changes, reject, validate, activate, suspend, reinstate, retire]
    UseCaseStatus:
      type: string
      description: Where the use case is in the advisory committee's decision.
      enum: [draft, submitted, changes_requested, validated, rejected]
    ReviewStatus:
      type: string
      description: |
        Where the review is: scheduled until the owner completes it, then
        waiting for a sign-off when the agent's risk tier needs one;
        cancelled when the agent is retired.
      enum: [scheduled, awaiting_signoff, completed, cancelled]
    Labels:
      type: object
      description: |
        Labels, which filters, selector halts and policies use; policies see
        them as Cedar tags. At most 64, as the decision profile allows
        (CORE-17): keys have 1 to 63 lowercase letters, digits and inner `.`,
        `_`, `-` and `/`, and values at most 255 characters. Enforcement points
        receive them with the agent's governance state, so they never hold
        personal data (CORE-9).
      maxProperties: 64
      propertyNames:
        pattern: "^[a-z0-9]([a-z0-9._/-]{0,61}[a-z0-9])?$"
      additionalProperties:
        type: string
        maxLength: 255
    PrincipalRef:
      type: object
      additionalProperties: false
      required: [id, status]
      description: |
        A principal, as the resources that name one show it. The display name
        is absent only where a caller asked to leave names out, as a
        pseudonymized export does.
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          description: An inactive principal no longer owns agents (INV-02, INV-05).
          enum: [active, inactive]
    Actor:
      type: object
      additionalProperties: false
      required: [type]
      description: Who made a change, by pseudonymous principal ID. The system is White Tower itself.
      properties:
        type:
          type: string
          enum: [human, service_account, breakglass, system]
        id:
          type: string
          format: uuid
          description: The principal's ID; the system has none.
        displayName:
          type: string
          description: The principal's display name; the system has none.
    Harness:
      type: object
      additionalProperties: false
      required: [description]
      description: |
        The declaration of what confines the agent where it runs. White Tower
        records it in the MVP, and enforces it from Phase 2 (requirements,
        section 5.1.1).
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 4000
    Suspension:
      type: object
      additionalProperties: false
      required: [from, reason, at]
      description: Why and since when the agent is suspended, and the state that reinstating it returns to (`from`).
      properties:
        from:
          type: string
          enum: [validated, ready, active]
        reason:
          $ref: "#/components/schemas/SuspensionReason"
        at:
          type: string
          format: date-time
    Agent:
      type: object
      additionalProperties: false
      description: |
        An agent of the inventory, in-house or third-party (INV-01). The
        suspension is present while the agent is suspended, and the harness
        once it is declared. Its ETag changes with every change to the agent,
        its delegates or its ownership transfers.
      required:
        - id
        - slug
        - name
        - description
        - kind
        - source
        - environments
        - riskTier
        - aiActClassification
        - dataCategories
        - useCaseId
        - lifecycleState
        - runState
        - coverage
        - labels
        - haltMode
        - drillEligible
        - primaryOwner
        - delegates
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: The agent's unique, readable key, which never changes.
        name:
          type: string
        description:
          type: string
        kind:
          $ref: "#/components/schemas/AgentKind"
        source:
          type: string
          description: How the agent entered the inventory; `discovered` is reserved for Phase 3.
          enum: [registered, imported, discovered]
        vendor:
          type: string
        framework:
          type: string
        deploymentLocation:
          type: string
        environments:
          type: array
          items:
            type: string
        riskTier:
          $ref: "#/components/schemas/RiskTier"
        aiActClassification:
          $ref: "#/components/schemas/AiActClassification"
        dataCategories:
          type: array
          description: The categories of data the agent accesses, from the setting `inventory.data_categories`.
          items:
            type: string
        useCaseId:
          type: string
          format: uuid
          description: The use case that justifies the agent (INV-03).
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        suspension:
          $ref: "#/components/schemas/Suspension"
        runState:
          $ref: "#/components/schemas/RunState"
        coverage:
          $ref: "#/components/schemas/CoverageLevel"
        harness:
          $ref: "#/components/schemas/Harness"
        labels:
          $ref: "#/components/schemas/Labels"
        haltMode:
          $ref: "#/components/schemas/HaltMode"
        drillEligible:
          type: boolean
          description: Whether the agent's owner lets kill-switch drills halt it (KIL-09).
        primaryOwner:
          $ref: "#/components/schemas/PrincipalRef"
        delegates:
          type: array
          items:
            $ref: "#/components/schemas/PrincipalRef"
        pendingOwnershipTransfer:
          $ref: "#/components/schemas/OwnershipTransfer"
        createdBy:
          $ref: "#/components/schemas/PrincipalRef"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
    AgentList:
      type: object
      additionalProperties: false
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        nextCursor:
          type: string
          nullable: true
    ProposeAgentRequest:
      type: object
      additionalProperties: false
      description: |
        A new agent: the mandatory metadata of INV-01, of which the vendor or
        the framework, at least one of them, and its options. The AI Act
        classification is `not_assessed`, the halt mode `interrupt` and drills
        not allowed, unless the request says otherwise.
      required: [slug, name, description, kind, deploymentLocation, environments, riskTier, dataCategories, useCaseId]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          description: Lowercase letters, digits and inner hyphens, 63 characters at most; unique, and never changed.
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        kind:
          $ref: "#/components/schemas/AgentKind"
        vendor:
          type: string
          maxLength: 200
        framework:
          type: string
          maxLength: 200
        deploymentLocation:
          type: string
          minLength: 1
          maxLength: 200
        environments:
          type: array
          description: Where the agent runs, such as `production`; lowercase letters, digits and inner hyphens.
          minItems: 1
          maxItems: 16
          items:
            type: string
            pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        riskTier:
          $ref: "#/components/schemas/RiskTier"
        aiActClassification:
          $ref: "#/components/schemas/AiActClassification"
        dataCategories:
          type: array
          description: The categories of data the agent accesses, from the setting `inventory.data_categories`.
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 63
        useCaseId:
          type: string
          format: uuid
        labels:
          $ref: "#/components/schemas/Labels"
        harness:
          $ref: "#/components/schemas/Harness"
        haltMode:
          $ref: "#/components/schemas/HaltMode"
        drillEligible:
          type: boolean
    EditAgentRequest:
      type: object
      additionalProperties: false
      description: The members to change; the others keep their values (editAgent).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        vendor:
          type: string
          maxLength: 200
        framework:
          type: string
          maxLength: 200
        deploymentLocation:
          type: string
          minLength: 1
          maxLength: 200
        environments:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        riskTier:
          $ref: "#/components/schemas/RiskTier"
        aiActClassification:
          $ref: "#/components/schemas/AiActClassification"
        dataCategories:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 63
        useCaseId:
          type: string
          format: uuid
        labels:
          $ref: "#/components/schemas/Labels"
        harness:
          $ref: "#/components/schemas/Harness"
        haltMode:
          $ref: "#/components/schemas/HaltMode"
        drillEligible:
          type: boolean
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/RequestedAction"
        comment:
          type: string
          maxLength: 2000
          description: |
            Why. `request_changes`, `reject`, `validate`, `suspend`,
            `reinstate` and `retire` need one, and a decision's comment is
            also the use case decision's. The agent's history shows it; its
            audit event records only that it was given.
    AgentActions:
      type: object
      additionalProperties: false
      required: [lifecycleState, actions]
      properties:
        lifecycleState:
          $ref: "#/components/schemas/LifecycleState"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AgentAction"
    AgentAction:
      type: object
      additionalProperties: false
      required: [action, transition, available, commentRequired, refusedBy]
      properties:
        action:
          $ref: "#/components/schemas/RequestedAction"
        transition:
          type: string
          pattern: "^T([2-9]|1[0-4])$"
          description: The transition's ID in the lifecycle specification.
        available:
          type: boolean
          description: Whether the caller may take the action now.
        commentRequired:
          type: boolean
        refusedBy:
          type: array
          description: |
            What refuses the action, empty when it is available: `permission`
            when the caller's roles, the scope of their grant (own, active
            only, sign-off) or their kind (people take decisions) do not allow
            it; `not_owner_or_creator` when separation of duties does (HUM-04);
            otherwise the guards of the lifecycle that do not hold, as
            agent-lifecycle.yaml names them: `metadata_complete`,
            `owner_active`, `use_case_not_prohibited`, `use_case_not_rejected`,
            `use_case_validated`, `agent_policy_active`, `harness_declared`,
            `not_halted`, `review_not_overdue` and
            `previous_state_invariants_hold`. A client shows a value it does
            not know as a generic refusal.
          items:
            type: string
            x-extensible-enum:
              - permission
              - metadata_complete
              - owner_active
              - not_owner_or_creator
              - use_case_not_prohibited
              - use_case_not_rejected
              - use_case_validated
              - agent_policy_active
              - harness_declared
              - not_halted
              - review_not_overdue
              - previous_state_invariants_hold
    Transition:
      type: object
      additionalProperties: false
      description: |
        One transition of an agent's lifecycle. `fromState` is absent for the
        agent's creation, T1, and `reason` is present for a suspension.
      required: [id, transition, action, toState, actor, stateVersion, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        transition:
          type: string
          pattern: "^T([1-9]|1[0-4])$"
        action:
          $ref: "#/components/schemas/LifecycleAction"
        fromState:
          $ref: "#/components/schemas/LifecycleState"
        toState:
          $ref: "#/components/schemas/LifecycleState"
        actor:
          $ref: "#/components/schemas/Actor"
        reason:
          $ref: "#/components/schemas/SuspensionReason"
        comment:
          type: string
        stateVersion:
          type: integer
          format: int64
          description: The governance state version that the transition took.
        occurredAt:
          type: string
          format: date-time
    TransitionList:
      type: object
      additionalProperties: false
      required: [transitions]
      properties:
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/Transition"
        nextCursor:
          type: string
          nullable: true
    Instance:
      type: object
      additionalProperties: false
      description: An instance of a module, such as an enforcement point, that serves the agent.
      required: [id, moduleId, moduleSlug, instanceKey, moduleVersion, contractVersion, status, connectedAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        moduleId:
          type: string
          format: uuid
        moduleSlug:
          type: string
        instanceKey:
          type: string
          description: The instance's key, unique within its module.
        moduleVersion:
          type: string
        contractVersion:
          type: string
          description: The version of the module contracts that the instance speaks.
        host:
          type: string
        status:
          type: string
          enum: [connected, disconnected, lost]
        connectedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        disconnectedAt:
          type: string
          format: date-time
        activeBundleVersion:
          type: integer
          format: int64
          description: The version of the agent's policy bundle that the instance applies.
        observedStateVersion:
          type: integer
          format: int64
          description: The last governance state version of the agent that the instance applied.
    InstanceList:
      type: object
      additionalProperties: false
      required: [instances]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        nextCursor:
          type: string
          nullable: true
    OwnerAssignment:
      type: object
      additionalProperties: false
      description: A principal's assignment as an agent's primary owner or delegate; an ended one records who ended it, and why.
      required: [id, principal, role, assignedBy, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        principal:
          $ref: "#/components/schemas/PrincipalRef"
        role:
          type: string
          enum: [primary, delegate]
        assignedBy:
          $ref: "#/components/schemas/PrincipalRef"
        assignedAt:
          type: string
          format: date-time
        endedBy:
          $ref: "#/components/schemas/PrincipalRef"
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string
          description: |
            Why the assignment ended: the reason of a reassignment or of a
            delegate's removal; `ownership transferred` when the new owner
            accepted a transfer; or `became the primary owner` for a delegate
            who did.
    OwnerAssignmentList:
      type: object
      additionalProperties: false
      required: [owners]
      properties:
        owners:
          type: array
          items:
            $ref: "#/components/schemas/OwnerAssignment"
        nextCursor:
          type: string
          nullable: true
    AddDelegateRequest:
      type: object
      additionalProperties: false
      required: [principalId]
      properties:
        principalId:
          type: string
          format: uuid
    ReassignOwnerRequest:
      type: object
      additionalProperties: false
      required: [principalId, reason]
      properties:
        principalId:
          type: string
          format: uuid
          description: The new primary owner.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    RequestOwnershipTransferRequest:
      type: object
      additionalProperties: false
      required: [principalId]
      properties:
        principalId:
          type: string
          format: uuid
          description: The principal offered the agent's ownership.
    OwnershipTransfer:
      type: object
      additionalProperties: false
      description: An offer of an agent's primary ownership, from its primary owner to another principal, who accepts or declines it.
      required: [id, agentId, from, to, requestedBy, requestedAt, status]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        from:
          $ref: "#/components/schemas/PrincipalRef"
        to:
          $ref: "#/components/schemas/PrincipalRef"
        requestedBy:
          $ref: "#/components/schemas/PrincipalRef"
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          description: Where the transfer is; `expired` is reserved, as nothing expires a transfer yet.
          enum: [pending, accepted, declined, cancelled, expired]
        decidedAt:
          type: string
          format: date-time
    UseCase:
      type: object
      additionalProperties: false
      description: |
        The business purpose that justifies one or more agents (INV-03). Its
        conditions are those under which the agents it justifies may run,
        which the advisory committee validates with it.
      required: [id, title, description, businessJustification, dataCategories, aiActClassification, status, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        businessJustification:
          type: string
        dataCategories:
          type: array
          items:
            type: string
        affectedPersons:
          type: string
          description: Who the work of its agents affects.
        aiActClassification:
          $ref: "#/components/schemas/AiActClassification"
        conditions:
          type: string
        status:
          $ref: "#/components/schemas/UseCaseStatus"
        createdBy:
          $ref: "#/components/schemas/PrincipalRef"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UseCaseList:
      type: object
      additionalProperties: false
      required: [useCases]
      properties:
        useCases:
          type: array
          items:
            $ref: "#/components/schemas/UseCase"
        nextCursor:
          type: string
          nullable: true
    CreateUseCaseRequest:
      type: object
      additionalProperties: false
      description: A new use case. Its AI Act classification is `not_assessed` unless the request says otherwise.
      required: [title, description, businessJustification, dataCategories]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        businessJustification:
          type: string
          minLength: 1
          maxLength: 4000
        dataCategories:
          type: array
          description: Categories from the setting `inventory.data_categories`.
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 63
        affectedPersons:
          type: string
          maxLength: 2000
        aiActClassification:
          $ref: "#/components/schemas/AiActClassification"
        conditions:
          type: string
          maxLength: 4000
    EditUseCaseRequest:
      type: object
      additionalProperties: false
      description: The members to change; the others keep their values (editUseCase).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        businessJustification:
          type: string
          minLength: 1
          maxLength: 4000
        dataCategories:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            maxLength: 63
        affectedPersons:
          type: string
          maxLength: 2000
        aiActClassification:
          $ref: "#/components/schemas/AiActClassification"
        conditions:
          type: string
          maxLength: 4000
    UseCaseDecision:
      type: object
      additionalProperties: false
      description: A decision of the advisory committee on a use case, made on an agent's proposal.
      required: [id, decision, comment, decidedBy, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        decision:
          type: string
          enum: [validated, rejected, changes_requested]
        comment:
          type: string
        agentId:
          type: string
          format: uuid
          description: The agent whose proposal was decided.
        decidedBy:
          $ref: "#/components/schemas/PrincipalRef"
        decidedAt:
          type: string
          format: date-time
    UseCaseDecisionList:
      type: object
      additionalProperties: false
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/UseCaseDecision"
        nextCursor:
          type: string
          nullable: true
    Review:
      type: object
      additionalProperties: false
      description: |
        A periodic review of an agent (INV-06). Once its grace period ends
        while it is still open, the agent is suspended (INV-05). The
        candidates to disable, and those the owner kept, are tooling: only
        the callers who may view agents' tooling see them (permission matrix:
        not the user role, and never a break-glass session), and lists leave
        the candidates out.
      required: [id, agentId, status, dueAt, graceEndsAt, overdue, signoffRequired, createdAt]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ReviewStatus"
        dueAt:
          type: string
          format: date-time
        graceEndsAt:
          type: string
          format: date-time
        overdue:
          type: boolean
          description: Whether the review is open past its due date.
        signoffRequired:
          type: boolean
        attestation:
          $ref: "#/components/schemas/ReviewAttestation"
        completedBy:
          $ref: "#/components/schemas/PrincipalRef"
        completedAt:
          type: string
          format: date-time
        signedOffBy:
          $ref: "#/components/schemas/PrincipalRef"
        signedOffAt:
          type: string
          format: date-time
        unusedTooling:
          type: array
          description: For an open review, the enabled tools and models that the agent has not used recently (CAT-09).
          items:
            $ref: "#/components/schemas/UnusedTooling"
        createdAt:
          type: string
          format: date-time
    UnusedTooling:
      type: object
      additionalProperties: false
      description: An enabled tool or model that the agent has not used recently, a candidate to disable (CAT-09).
      required: [key, kind]
      properties:
        key:
          type: string
          description: The key of the tool or model in the catalog (RFC-0002, section 3).
        kind:
          type: string
          enum: [tool, model]
        lastUsedAt:
          type: string
          format: date-time
          description: When the agent last used it; absent if it never did.
    ReviewAttestation:
      type: object
      additionalProperties: false
      description: |
        The owner's attestation (INV-06). Each statement must be true: an
        agent no longer needed is retired instead, an agent whose owner is no
        longer right gets another one, and its data categories and policy are
        brought up to date before the review is completed.
      required: [stillNeeded, ownerStillRight, dataCategoriesCurrent, policyAdequate, toolingStillNeeded]
      properties:
        stillNeeded:
          type: boolean
        ownerStillRight:
          type: boolean
        dataCategoriesCurrent:
          type: boolean
        policyAdequate:
          type: boolean
        toolingStillNeeded:
          type: boolean
        keptTooling:
          type: array
          description: The keys of the candidates to disable that the owner keeps; none when absent.
          maxItems: 500
          items:
            type: string
            maxLength: 255
        comment:
          type: string
          maxLength: 2000
    ReviewList:
      type: object
      additionalProperties: false
      required: [reviews]
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        nextCursor:
          type: string
          nullable: true
    InboxItem:
      type: object
      additionalProperties: false
      description: Work that waits for the caller, addressed to them or to one of their roles.
      required: [id, kind, subjectType, subjectId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: |
            What waits: `use_case_validation`, `policy_approval`,
            `review_due`, `review_signoff`, `halt_release`,
            `ownership_transfer`, `module_approval`, `catalog_review` (an
            entry, a definition or a digest of the catalog that waits for
            review), `tooling_request` (a request to enable tooling for an
            agent) or `unblock_request` (a request to lift a block). Later
            plans add kinds, and a client shows a kind it does not know
            generically.
          x-extensible-enum:
            - use_case_validation
            - policy_approval
            - review_due
            - review_signoff
            - halt_release
            - ownership_transfer
            - module_approval
            - catalog_review
            - tooling_request
            - unblock_request
        subjectType:
          type: string
          description: The kind of resource the item is about, such as `agent`, `review` or `ownership_transfer`.
        subjectId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
          description: The agent the item is about, when there is one.
        role:
          type: string
          description: The caller's role that the item is addressed to; absent when it is addressed to the caller.
          enum: [steering, advisory, owner, user, operator, auditor, admin]
        createdAt:
          type: string
          format: date-time
    DataCategoryList:
      type: object
      additionalProperties: false
      required: [dataCategories]
      properties:
        dataCategories:
          type: array
          items:
            type: string
    InboxItemList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxItem"
        nextCursor:
          type: string
          nullable: true
    CatalogStatus:
      type: string
      description: |
        An entry is discovered until the advisory committee approves it
        (CAT-02). A declined entry stays discovered, so it stays denied.
      enum: [discovered, approved]
    CatalogFlag:
      type: string
      maxLength: 64
      description: |
        What the core flags for reviewers: `unpinned_package`, a local server
        launched through `npx`, `uvx`, `pipx run` or `bunx` without an exact
        version (threat model, T-77); `secret_in_path`, a reference whose URL
        path has a segment that looks like a secret, for which the
        administrator may add a redaction rule (CAT-10, T-76). Later plans
        may add flags: a client shows a flag it does not know as it is, and a
        filter on a flag the server does not know is refused
        (`bad_request`).
      x-extensible-enum:
        - unpinned_package
        - secret_in_path
    CatalogEntryType:
      type: string
      enum: [server, tool, model]
    ToolKind:
      type: string
      description: |
        `function` is the agent's own code, `mcp` a tool of an MCP server,
        `builtin` a tool that the model provider defines and runs, and
        `http` and `other` the agent's own tools of those kinds (contracts,
        section 4.10).
      enum: [function, mcp, builtin, http, other]
    ToolOrigin:
      type: string
      description: |
        Who runs the tool, as a source reported it: `agent` (the agent's
        process, or an MCP server the agent connects to) or `provider` (the
        model provider, during a model call). One remote MCP server can be
        run by one agent and by another agent's provider, so the origin is
        an observation's, never the catalog entry's.
      enum: [agent, provider]
    CatalogRequestStatus:
      type: string
      enum: [pending, approved, declined]
    ArgumentType:
      type: string
      description: An argument's type, as Cedar names it (contracts, section 7.7).
      enum: [String, Long, Bool, "Set<String>", "Set<Long>"]
    ArgumentTransform:
      type: string
      description: The transform that applies to a string, or to each string of a set, before policies see it (contracts, section 6.11).
      enum: [lowercase, path, url_host, email_domain]
    CatalogDecline:
      type: object
      additionalProperties: false
      description: |
        A reviewer's decline of an entry, or of one of its definitions or
        digests, which then no longer waits for review.
      required: [reason, declinedBy, declinedAt]
      properties:
        reason:
          type: string
        declinedBy:
          $ref: "#/components/schemas/PrincipalRef"
        declinedAt:
          type: string
          format: date-time
        definitionSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The declined definition, when a definition was declined rather than the tool.
        digest:
          type: string
          description: The declined digest, when a digest was declined rather than the model.
    CatalogServer:
      type: object
      additionalProperties: false
      description: |
        An MCP server of the catalog (RFC-0002, section 3). Its reference,
        announced name and version and display form were reported, redacted
        by the enforcement point and again by the core (CAT-10): untrusted
        text, shown as plain text.
      required: [id, key, reference, transport, status, blocked, pendingReview, flags, firstAgentId, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: "^[a-z0-9-]{1,63}$"
          description: The key that the core assigned, which never changes once the server is approved.
        reference:
          type: string
          description: The server's reference, a normalized URL, a `connector:` name or a `stdio:` command line (contracts, section 4.10).
        transport:
          type: string
          enum: [stdio, http]
        announcedName:
          type: string
          description: The name the server announces.
        announcedVersion:
          type: string
          description: The version the server announces.
        displayForm:
          type: string
          description: The server's URL or command line, redacted.
        status:
          $ref: "#/components/schemas/CatalogStatus"
        blocked:
          type: boolean
          description: Whether an active block covers the server; a block never changes its status.
        pendingReview:
          type: boolean
          description: Whether the server waits for review.
        flags:
          type: array
          items:
            $ref: "#/components/schemas/CatalogFlag"
        firstAgentId:
          type: string
          format: uuid
          description: The agent whose report or declaration first brought the server.
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        approvedBy:
          $ref: "#/components/schemas/PrincipalRef"
        approvedAt:
          type: string
          format: date-time
        lastDecline:
          $ref: "#/components/schemas/CatalogDecline"
    CatalogServerList:
      type: object
      additionalProperties: false
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogServer"
        nextCursor:
          type: string
          nullable: true
    ToolClassification:
      type: object
      additionalProperties: false
      description: |
        The reviewer's classification of a tool, which policies read
        (`read_only`, `destructive` and `open_world`). The MCP annotations
        are hints from the server; these values have been reviewed.
      required: [readOnly, destructive, openWorld]
      properties:
        readOnly:
          type: boolean
        destructive:
          type: boolean
        openWorld:
          type: boolean
    ToolArgumentDeclaration:
      type: object
      additionalProperties: false
      description: |
        An argument that policies may see (RFC-0002, section 7.5): its path
        in the call's arguments, through objects only, its transform and its
        type. A property whose name holds `.` or `:` cannot be declared, and
        a transform applies to `String` and `Set<String>` only. The
        argument's name is its path joined with `.`, followed by `:` and the
        transform when it has one, and a tool declares each name once. A
        property name is never empty and holds no control character (U+0000
        to U+001F, U+007F), since the generator of usage rules refuses one in
        an argument's name (contracts, section 6.11); the server also refuses
        a lone surrogate or a noncharacter, as it does in a report.
      required: [path, type]
      properties:
        path:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[^.:\\u0000-\\u001F\\u007F]+$"
        transform:
          $ref: "#/components/schemas/ArgumentTransform"
        type:
          $ref: "#/components/schemas/ArgumentType"
    ToolArgument:
      type: object
      additionalProperties: false
      description: A declared argument, under the name that is its key in the tool's record of `context.args`.
      required: [name, path, type]
      properties:
        name:
          type: string
        path:
          type: array
          items:
            type: string
        transform:
          $ref: "#/components/schemas/ArgumentTransform"
        type:
          $ref: "#/components/schemas/ArgumentType"
    CatalogTool:
      type: object
      additionalProperties: false
      description: |
        A tool of the catalog (RFC-0002, section 3). An MCP tool names its
        server, an agent's own tool its agent, and a built-in tool its
        provider and type. Its name was reported: untrusted text. The tool
        has no origin: each observation has its own (listAgentTooling).
      required: [id, key, kind, name, status, blocked, pendingReview, pendingDefinitions, arguments, firstAgentId, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: |
            The key that the core assigned: `<server key>/<name>`,
            `agent/<name>` for an agent's own tool, unique within its agent,
            or `provider.<provider>/<type>` for a built-in tool. It never
            changes once the tool is approved.
        kind:
          $ref: "#/components/schemas/ToolKind"
        name:
          type: string
        serverId:
          type: string
          format: uuid
          description: An MCP tool's server.
        agentId:
          type: string
          format: uuid
          description: The agent whose own tool this is.
        provider:
          type: string
          description: A built-in tool's provider.
        type:
          type: string
          description: A built-in tool's type, as its provider names it.
        status:
          $ref: "#/components/schemas/CatalogStatus"
        blocked:
          type: boolean
          description: Whether an active block covers the tool or its server.
        pendingReview:
          type: boolean
          description: Whether the tool, or one of its definitions, waits for review.
        definitionSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The pinned definition hash, once approved; a built-in tool has none.
        pendingDefinitions:
          type: array
          description: |
            The reported definitions that differ from the pinned one and wait
            for review, by hash. Enforcement points deny and hide the tool
            for an agent whose definition differs from the pinned one
            (RFC-0002, section 7.1).
          items:
            type: string
            pattern: "^[0-9a-f]{64}$"
        classification:
          $ref: "#/components/schemas/ToolClassification"
        arguments:
          type: array
          description: The arguments policies may see, empty until a reviewer declares them.
          items:
            $ref: "#/components/schemas/ToolArgument"
        firstAgentId:
          type: string
          format: uuid
          description: The agent whose report or declaration first brought the tool.
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        approvedBy:
          $ref: "#/components/schemas/PrincipalRef"
        approvedAt:
          type: string
          format: date-time
        lastDecline:
          $ref: "#/components/schemas/CatalogDecline"
    CatalogToolList:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTool"
        nextCursor:
          type: string
          nullable: true
    ToolDefinition:
      type: object
      additionalProperties: false
      description: |
        A tool definition, the members that its hash covers, as reported
        (contracts, section 4.10): an MCP tool's `name`, `title`,
        `description`, `inputSchema`, `outputSchema` and `annotations`, and
        another tool's `name` and `inputSchema`. Integers keep their exact
        value, whatever their size.
      required: [name]
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        inputSchema:
          description: The tool's input schema, as reported.
        outputSchema:
          description: The tool's output schema, as reported.
        annotations:
          description: The tool's MCP annotations, as reported.
    CatalogModel:
      type: object
      additionalProperties: false
      description: |
        A model of the catalog (RFC-0002, section 3). Its endpoint and name
        were reported: untrusted text.
      required: [id, key, provider, endpoint, name, status, blocked, pendingReview, flags, pendingDigests, firstAgentId, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: |
            The key that the core assigned, a slug of the provider or the
            endpoint, a slash and a slug of the name. It never changes once
            the model is approved.
        provider:
          type: string
          description: The provider, from the contracts' table of model providers (section 6.3) or a lowercase name of its own.
        endpoint:
          type: string
          description: The normalized base URL of the endpoint the agent calls.
        name:
          type: string
          description: The model's name, as requested.
        status:
          $ref: "#/components/schemas/CatalogStatus"
        blocked:
          type: boolean
          description: Whether an active block covers the model, its provider or its endpoint.
        pendingReview:
          type: boolean
          description: Whether the model, or one of its digests, waits for review.
        flags:
          type: array
          items:
            $ref: "#/components/schemas/CatalogFlag"
        digest:
          type: string
          description: The pinned digest of the model's weights, when its runtime reported one at approval.
        pendingDigests:
          type: array
          description: |
            The reported digests that differ from the pinned one and wait for
            review. Enforcement points deny the model for a runtime whose
            digest differs from the pinned one (RFC-0002, section 7.1).
          items:
            type: string
        firstAgentId:
          type: string
          format: uuid
          description: The agent whose report or declaration first brought the model.
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        approvedBy:
          $ref: "#/components/schemas/PrincipalRef"
        approvedAt:
          type: string
          format: date-time
        lastDecline:
          $ref: "#/components/schemas/CatalogDecline"
    CatalogModelList:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/CatalogModel"
        nextCursor:
          type: string
          nullable: true
    CatalogToolApproval:
      type: object
      additionalProperties: false
      required: [classification]
      properties:
        definitionSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The definition the reviewer saw in full, which approval pins. Required for every tool but a built-in one, which must not have it.
        classification:
          $ref: "#/components/schemas/ToolClassification"
        arguments:
          type: array
          description: The arguments policies may see; none when absent.
          maxItems: 64
          items:
            $ref: "#/components/schemas/ToolArgumentDeclaration"
    ServerToolApproval:
      type: object
      additionalProperties: false
      required: [toolId, approval]
      properties:
        toolId:
          type: string
          format: uuid
          description: A tool of the server being approved.
        approval:
          $ref: "#/components/schemas/CatalogToolApproval"
    ApproveCatalogServerRequest:
      type: object
      additionalProperties: false
      properties:
        tools:
          type: array
          description: The server's tools to approve with it, each once; none when absent.
          maxItems: 4096
          items:
            $ref: "#/components/schemas/ServerToolApproval"
    ApproveCatalogModelRequest:
      type: object
      additionalProperties: false
      properties:
        digest:
          type: string
          minLength: 1
          maxLength: 128
          description: The digest of the weights the reviewer approves, which approval pins. Required when the model's runtime reported one.
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ApprovalRequest:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          maxLength: 1000
    DeclineCatalogToolRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        definitionSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: A definition that waits for review, to decline it rather than the tool.
    DeclineCatalogModelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        digest:
          type: string
          minLength: 1
          maxLength: 128
          description: A digest that waits for review, to decline it rather than the model.
    DeclinePendingFromAgentRequest:
      type: object
      additionalProperties: false
      required: [agentId, reason]
      properties:
        agentId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    CatalogDeclineSummary:
      type: object
      additionalProperties: false
      description: How many entries, definitions and digests were declined.
      required: [servers, tools, models, definitions, digests]
      properties:
        servers:
          type: integer
        tools:
          type: integer
        models:
          type: integer
        definitions:
          type: integer
        digests:
          type: integer
    CatalogBlockKind:
      type: string
      description: What a block covers, which its target names (RFC-0002, section 6).
      enum: [server, tool, model, provider, endpoint]
    IssueCatalogBlockRequest:
      type: object
      additionalProperties: false
      required: [kind, target, reason]
      properties:
        kind:
          $ref: "#/components/schemas/CatalogBlockKind"
        target:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            What the block covers: the string form of the reference of a
            server, a tool or a model (contracts, section 4.10), a provider,
            or the normalized base URL of an endpoint.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    CatalogBlockSpread:
      type: object
      additionalProperties: false
      description: How many connected enforcement points acknowledged a state version that carries the block (EP-15).
      required: [enforcementPoints, acknowledged]
      properties:
        enforcementPoints:
          type: integer
        acknowledged:
          type: integer
    CatalogUnblockRequest:
      type: object
      additionalProperties: false
      description: A request to lift a block, which someone else on the steering or the advisory committee decides (HUM-04).
      required: [id, blockId, reason, requestedBy, requestedAt, status]
      properties:
        id:
          type: string
          format: uuid
        blockId:
          type: string
          format: uuid
        reason:
          type: string
        requestedBy:
          $ref: "#/components/schemas/PrincipalRef"
        requestedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CatalogRequestStatus"
        decidedBy:
          $ref: "#/components/schemas/PrincipalRef"
        decidedAt:
          type: string
          format: date-time
        comment:
          type: string
          description: The approver's comment, or the reason of a decline.
    CatalogBlock:
      type: object
      additionalProperties: false
      description: |
        An organization-wide block (CAT-04). Enforcement points receive its
        ID, kind and the SHA-256 of its target; the target in clear and the
        reason stay in the core.
      required: [id, kind, target, targetSha256, reason, issuedBy, issuedAt, issuedStateVersion, status]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/CatalogBlockKind"
        target:
          type: string
        targetSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The SHA-256 of the target's UTF-8 bytes.
        entryKey:
          type: string
          description: The key of the catalog entry the block covers, when the catalog has one.
        reason:
          type: string
        issuedBy:
          $ref: "#/components/schemas/PrincipalRef"
        issuedAt:
          type: string
          format: date-time
        issuedStateVersion:
          type: integer
          format: int64
          description: The governance state version that carries the block.
        status:
          type: string
          enum: [active, lifted]
        liftedAt:
          type: string
          format: date-time
        liftedStateVersion:
          type: integer
          format: int64
          description: The governance state version that lifted the block.
        spread:
          $ref: "#/components/schemas/CatalogBlockSpread"
        unblockRequest:
          $ref: "#/components/schemas/CatalogUnblockRequest"
    CatalogBlockList:
      type: object
      additionalProperties: false
      required: [blocks]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/CatalogBlock"
        nextCursor:
          type: string
          nullable: true
    CompileUsageRulesRequest:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        agentId:
          type: string
          format: uuid
          description: The agent of an agent-specific policy; absent for a global policy.
        rules:
          type: string
          maxLength: 262144
          description: |
            The JSON text of the policy's usage rules, an array of objects
            with `id`, `description`, `tools` and `when`, whose conditions
            have `arg`, `op`, `values` and optionally `transform` and
            `if_absent` (contracts, section 6.11): at most 256 KiB of UTF-8.
    CompiledUsageRules:
      type: object
      additionalProperties: false
      required: [statements]
      properties:
        statements:
          type: string
          description: The Cedar statements, separated by an empty line.
    ToolingObservation:
      type: object
      additionalProperties: false
      description: |
        What one source holds of an entry for the agent: an instance's
        reports, or a person's declaration. A report's tool has the origin
        and the definition hash it reported, and a report's model the digest.
      required: [source, firstSeenAt, lastSeenAt, current]
      properties:
        source:
          type: string
          enum: [report, declaration]
        instanceId:
          type: string
          format: uuid
          description: The reporting instance.
        declaredBy:
          $ref: "#/components/schemas/PrincipalRef"
        origin:
          $ref: "#/components/schemas/ToolOrigin"
        definitionSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        digest:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Whether the source's latest report or declaration still holds the entry.
    AgentToolingEntry:
      type: object
      additionalProperties: false
      description: |
        An entry of the catalog as it stands for the agent. A server is
        enabled when one of its tools is, since an agent is enabled to use
        tools and models.
      required: [entryType, entryId, key, status, blocked, enabled, declared, observations]
      properties:
        entryType:
          $ref: "#/components/schemas/CatalogEntryType"
        entryId:
          type: string
          format: uuid
        key:
          type: string
        status:
          $ref: "#/components/schemas/CatalogStatus"
        blocked:
          type: boolean
        enabled:
          type: boolean
        enabledAt:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid
          description: The approved request that enabled the entry.
        lastUsedAt:
          type: string
          format: date-time
          description: When the agent last used the enabled entry, as allowed decisions record it (CAT-09).
        declared:
          type: boolean
        observations:
          type: array
          items:
            $ref: "#/components/schemas/ToolingObservation"
    AgentToolingList:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AgentToolingEntry"
        nextCursor:
          type: string
          nullable: true
    ToolingEntrySelector:
      type: object
      additionalProperties: false
      required: [entryType, entryId]
      properties:
        entryType:
          $ref: "#/components/schemas/CatalogEntryType"
        entryId:
          type: string
          format: uuid
    ToolingEntryRef:
      type: object
      additionalProperties: false
      required: [entryType, entryId, key]
      properties:
        entryType:
          $ref: "#/components/schemas/CatalogEntryType"
        entryId:
          type: string
          format: uuid
        key:
          type: string
    ToolingEntryRefList:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ToolingEntryRef"
    DisableAgentToolingRequest:
      type: object
      additionalProperties: false
      required: [entries, reason]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 256
          items:
            $ref: "#/components/schemas/ToolingEntrySelector"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    RequestAgentToolingRequest:
      type: object
      additionalProperties: false
      required: [entry, reason]
      properties:
        entry:
          $ref: "#/components/schemas/ToolingEntrySelector"
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ToolingRequest:
      type: object
      additionalProperties: false
      description: A request to enable a tool, a model or an MCP server's approved tools for an agent, decided once.
      required: [id, agentId, entry, reason, requestedBy, requestedAt, status]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        entry:
          $ref: "#/components/schemas/ToolingEntryRef"
        reason:
          type: string
        requestedBy:
          $ref: "#/components/schemas/PrincipalRef"
        requestedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/CatalogRequestStatus"
        decidedBy:
          $ref: "#/components/schemas/PrincipalRef"
        decidedAt:
          type: string
          format: date-time
        comment:
          type: string
          description: The approver's comment, or the reason of a decline.
        enabled:
          type: array
          description: What the approval enabled, an MCP server's approved tools for a request that names a server.
          items:
            $ref: "#/components/schemas/ToolingEntryRef"
    ToolingRequestList:
      type: object
      additionalProperties: false
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/ToolingRequest"
        nextCursor:
          type: string
          nullable: true
    DeclaredServer:
      type: object
      additionalProperties: false
      description: A declared MCP server, as a report carries one; the server checks the limits in UTF-8 bytes.
      required: [reference, transport]
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 2048
        transport:
          type: string
          enum: [stdio, http]
        name:
          type: string
          maxLength: 256
        version:
          type: string
          maxLength: 128
        displayForm:
          type: string
          maxLength: 2048
    DeclaredTool:
      type: object
      additionalProperties: false
      description: |
        A declared tool, as a report carries one: an MCP tool names its
        server by its position in `servers`, and a built-in tool its provider
        and type.
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/ToolKind"
        name:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^[^\\u0000-\\u001F\\u007F]+$"
        server:
          type: integer
          minimum: 0
          maximum: 255
        provider:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[^\\u0000-\\u001F\\u007F]+$"
        type:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[^\\u0000-\\u001F\\u007F]+$"
    DeclaredModel:
      type: object
      additionalProperties: false
      required: [provider, endpoint, name]
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[^\\u0000-\\u001F\\u007F]+$"
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
        name:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^[^\\u0000-\\u001F\\u007F]+$"
    DeclareToolingRequest:
      type: object
      additionalProperties: false
      description: |
        The complete tooling declared for an agent, in the shape and within
        the limits of a tooling report (contracts, section 4.10). A tool's
        name, provider and type and a model's provider and name, which become
        keys, hold no control character (U+0000 to U+001F, U+007F), since the
        generator of usage rules refuses one in a tool's key (contracts,
        section 6.11); the server also refuses a lone surrogate or a
        noncharacter in any string, as it does in a report.
      required: [servers, tools, models]
      properties:
        servers:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/DeclaredServer"
        tools:
          type: array
          maxItems: 4096
          items:
            $ref: "#/components/schemas/DeclaredTool"
        models:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/DeclaredModel"
    DeclaredTooling:
      type: object
      additionalProperties: false
      required: [servers, tools, models]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/DeclaredServer"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/DeclaredTool"
        models:
          type: array
          items:
            $ref: "#/components/schemas/DeclaredModel"
        declaredBy:
          $ref: "#/components/schemas/PrincipalRef"
        declaredAt:
          type: string
          format: date-time
