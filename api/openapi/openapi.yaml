openapi: 3.1.0
info:
  title: White Tower public API
  version: 0.0.0
  summary: Public REST API of the White Tower governance core.
  description: |
    This document is the source of truth of the public API: the Go server
    interfaces, the Go client and the console's TypeScript types are generated
    from it with `task gen`. The server serves it at `/api/v1/openapi.json`.

    Every operation needs a session or an API token, unless it says
    otherwise. Errors are RFC 9457 problem details, whose `code` member is a
    stable error code (docs/reference/api-errors.md); messages are in
    English. Clients are rate-limited, per principal or, before login, per
    client address.

    Pre-alpha: only placeholder operations exist until the Phase 1 plans add
    the real ones.
  contact:
    name: White Tower maintainers
    url: https://github.com/J466Y/WhiteTower
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - session: []
  - apiToken: []
tags:
  - name: meta
    description: Information about the server itself.
  - name: identity
    description: Who is calling.
  - name: tokens
    description: API tokens for personal access and automation.
paths:
  /version:
    get:
      operationId: getVersion
      summary: Get the version of the running server
      description: |
        Returns the release version and Git commit of the running server, and
        the version of this API. It needs no authentication, so clients can
        check compatibility before logging in.
      tags: [meta]
      security: []
      responses:
        "200":
          description: Version of the running server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Get the calling principal
      description: |
        Returns the calling principal, their roles, their permissions derived
        from the governance matrix, and the CSRF token of the active session.
      tags: [identity]
      responses:
        "200":
          description: The calling principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        default:
          $ref: "#/components/responses/Problem"
  /tokens:
    get:
      operationId: listTokens
      summary: List API tokens
      description: Lists active and historical API tokens for the calling principal or a service account.
      tags: [tokens]
      parameters:
        - name: principalId
          in: query
          required: false
          description: Optional principal ID to filter tokens (allowed for responsible owners and administrators).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The list of API tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiTokenMetadata"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      summary: Create an API token
      description: |
        Generates a new API token. The raw token secret is returned in the response
        and is never retrievable again.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The created API token including its plaintext secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Problem"
  /tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke an API token
      description: Revokes an active API token by its ID.
      tags: [tokens]
      parameters:
        - name: id
          in: path
          required: true
          description: The token identifier.
          schema:
            type: string
            format: uuid
        - name: reason
          in: query
          required: false
          description: Reason for revocation.
          schema:
            type: string
      responses:
        "204":
          description: Token successfully revoked.
        default:
          $ref: "#/components/responses/Problem"
  /tokens/exchange:
    post:
      operationId: exchangeToken
      summary: Exchange CLI ID token for an API token
      description: |
        Exchanges an OpenID Connect ID token from the CLI's public client login for a short-lived
        API token (12 hours) bound to the same human principal.
      tags: [tokens]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeTokenRequest"
      responses:
        "200":
          description: The created API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        default:
          $ref: "#/components/responses/Problem"
  /service-accounts:
    get:
      operationId: listServiceAccounts
      summary: List service accounts
      description: Lists service accounts owned by the calling principal or all service accounts for administrators.
      tags: [identity]
      responses:
        "200":
          description: The list of service accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceAccount"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createServiceAccount
      summary: Create a service account
      description: Creates a non-human service account principal with the caller as responsible principal.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountRequest"
      responses:
        "201":
          description: The created service account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-wt_session
      description: |
        The console's session, which the login under /auth sets
        (ADR-0009). State-changing requests also send the session's CSRF
        token in a header.
    apiToken:
      type: http
      scheme: bearer
      description: An API token, prefixed `wt_pat_`, for the CLI and the organization's tools.
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    VersionInfo:
      type: object
      additionalProperties: false
      required: [version, commit, apiVersion]
      properties:
        version:
          type: string
          description: Release version, or `dev` for local builds.
        commit:
          type: string
          description: Git commit the binary was built from, or `unknown`.
        apiVersion:
          type: string
          description: Version of this API.
          enum: [v1]
    Principal:
      type: object
      additionalProperties: false
      required: [id, kind, displayName, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
          description: The principal's identifier.
        kind:
          type: string
          enum: [human, service_account]
        displayName:
          type: string
        roles:
          type: array
          description: The roles bound to the principal (requirements, permission matrix).
          items:
            type: string
        permissions:
          type: array
          description: The permissions granted by the principal's roles (permission matrix).
          items:
            type: string
        csrfToken:
          type: string
          description: The session's CSRF token for state-changing requests, if authenticated via session.
        isBreakglass:
          type: boolean
          description: True if authenticated via emergency break-glass session.
    Problem:
      type: object
      description: |
        RFC 9457 problem details. `type` and `code` identify the error;
        `title` is the same for every occurrence of it, and `detail`
        explains this one. No internal detail reaches the client.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Identifies the error, and links to its documentation.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: This occurrence, as `urn:uuid:` followed by the request ID, which the logs record.
        code:
          type: string
          description: The stable error code.
    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Friendly name for the token.
        scopes:
          type: array
          minItems: 1
          items:
            type: string
          description: The permissions granted to the token (must be subset of effective permissions).
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
          description: Lifetime of the token in days (max 90).
        principalId:
          type: string
          format: uuid
          description: Optional principal ID to issue the token for (service account owned by caller or by admin).
    CreatedToken:
      type: object
      additionalProperties: false
      required: [id, principalId, name, tokenPrefix, scopes, token, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        name:
          type: string
        tokenPrefix:
          type: string
          description: The prefix of the token, useful for identification.
        scopes:
          type: array
          items:
            type: string
        token:
          type: string
          description: The raw plaintext API token. It is only returned once and never stored.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ApiTokenMetadata:
      type: object
      additionalProperties: false
      required: [id, principalId, name, tokenPrefix, scopes, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        principalId:
          type: string
          format: uuid
        name:
          type: string
        tokenPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
    CreateServiceAccountRequest:
      type: object
      additionalProperties: false
      required: [displayName, roles]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          nullable: true
        roles:
          type: array
          minItems: 1
          items:
            type: string
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [id, displayName, status, responsiblePrincipalId, roles, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        responsiblePrincipalId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    ExchangeTokenRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Raw OpenID Connect ID token obtained by the CLI.

