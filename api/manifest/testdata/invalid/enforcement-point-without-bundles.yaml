# Invalid: an enforcement point needs to read its bundles.
apiVersion: whitetower/v1alpha1
kind: ModuleManifest
metadata: {name: bad-ep, version: 0.1.0, vendor: Example, license: Apache-2.0}
spec:
  contractVersions: [v1alpha1]
  identity: module
  agents: bound
  capabilities:
    - {name: enforcement-point, interventionPoints: [tool.invoke, model.invoke], haltModes: [block], haltLayers: [gate_closed]}
  events:
    emits: [whitetower.decision.made.v1, whitetower.action.executed.v1, whitetower.instance.halted.v1,
      whitetower.bundle.activated.v1, whitetower.bundle.rejected.v1, whitetower.lease.expired.v1]
    consumes: []
  permissions: [governance.watch, governance.acknowledge, events.publish]
